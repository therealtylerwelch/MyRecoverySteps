<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  Source for og-image-v2.jpg (iOS/iMessage share card).
  Regenerate with:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --screenshot=og-shot.png --window-size=1200,630 --hide-scrollbars "file://$(pwd)/og-source.html"
    sips -s format jpeg -s formatOptions 80 og-shot.png --out og-image-v2.jpg && rm og-shot.png
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(ellipse 110% 30% at 50% 28%, rgba(255,255,255,0.14) 0%, transparent 100%),
      radial-gradient(ellipse 80% 60% at 8% 30%, rgba(116,172,223,0.55) 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 50% 105%, rgba(10, 40, 85, 0.90) 0%, transparent 65%),
      linear-gradient(155deg, #0f3d6b 0%, #1a6cb5 35%, #3b8fd4 70%, #74ACDF 100%);
    position: relative;
  }
  .wrap { position: relative; z-index: 2; padding: 74px 92px 0; }
  .row { display: flex; align-items: center; gap: 38px; }
  .badge {
    width: 152px; height: 152px; flex: 0 0 auto;
    border-radius: 34px; overflow: hidden;
    box-shadow: 0 16px 44px rgba(0,0,0,0.42), 0 4px 12px rgba(0,0,0,0.28);
  }
  .badge img { width: 100%; height: 100%; display: block; }
  .eyebrow {
    font-size: 31px; font-weight: 700; letter-spacing: 11px;
    color: #FBDA6A; text-transform: uppercase; margin-bottom: 8px;
  }
  .title {
    font-size: 112px; font-weight: 800; letter-spacing: -3px; line-height: 0.95;
    background: linear-gradient(115deg, #FFFFFF 0%, #E8F4FF 45%, #BEE1FF 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tag {
    margin-top: 54px;
    font-size: 35px; font-weight: 600; line-height: 1.35; color: #FFFFFF;
    text-shadow: 0 2px 10px rgba(0,0,0,0.18);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 16px;
    margin-top: 36px;
    background: #F6B40E; color: #1d3a63;
    font-size: 28px; font-weight: 700; letter-spacing: 0.2px;
    padding: 17px 36px; border-radius: 60px;
    box-shadow: 0 10px 30px rgba(246,180,14,0.38);
  }
  .pill svg { display: block; }
  .rings {
    position: absolute; left: 0; right: 0; bottom: 44px;
    display: flex; justify-content: center; gap: 46px;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row">
      <div class="badge"><img src="android-chrome-192x192.png" alt=""></div>
      <div>
        <div class="eyebrow">My Recovery</div>
        <div class="title">Steps</div>
      </div>
    </div>
    <div class="tag">Tracking my mountain bike accident recovery progress.</div>
    <div class="pill">
      <svg width="30" height="30" viewBox="0 0 30 30">
        <circle cx="15" cy="15" r="11" fill="none" stroke="rgba(29,58,99,0.30)" stroke-width="5"/>
        <circle cx="15" cy="15" r="11" fill="none" stroke="#1d3a63" stroke-width="5" stroke-linecap="round"
                stroke-dasharray="55.3 69.1" transform="rotate(-90 15 15)"/>
      </svg>
      Consistency, not distance&nbsp;&nbsp;·&nbsp;&nbsp;One step at a time
    </div>
  </div>

  <!-- A week of mostly-closed goal rings — the site's consistency motif -->
  <div class="rings">
    <script>
      const closure = [1, 0.45, 1, 1, 0.7, 1, 1, 0.55, 1, 1];
      const C = 2 * Math.PI * 30;
      document.currentScript.parentElement.innerHTML += closure.map((p, i) => `
        <svg width="76" height="76" viewBox="0 0 76 76" style="opacity:${p === 1 ? 0.55 : 0.38};">
          <circle cx="38" cy="38" r="30" fill="none" stroke="rgba(232,244,255,0.28)" stroke-width="9"/>
          <circle cx="38" cy="38" r="30" fill="none" stroke="#FBDA6A" stroke-width="9" stroke-linecap="round"
                  stroke-dasharray="${(p * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 38 38)"/>
        </svg>`).join('');
    </script>
  </div>
</body>
</html>
