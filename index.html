<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyRecoverySteps</title>

  <!-- Favicons: SVG for crisp modern browsers, ICO/PNG fallbacks -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

  <!-- iOS homescreen icon (solid square; iOS applies corner radius) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Android / PWA -->
  <link rel="manifest" href="site.webmanifest">

  <!-- iOS web-app appearance when launched from homescreen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyRecoverySteps">
  <meta name="theme-color" content="#74ACDF">

  <!-- SEO -->
  <meta name="description" content="Tracking daily walking progress · Powered by Strava">

  <!-- Open Graph (iMessage, Facebook, LinkedIn, Slack…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="My Recovery Steps">
  <meta property="og:title" content="My Recovery Steps">
  <meta property="og:description" content="Tracking daily walking progress · Powered by Strava">
  <meta property="og:url" content="https://myrecoverysteps.com/">
  <meta property="og:image" content="https://myrecoverysteps.com/og-image.png">
  <meta property="og:image:secure_url" content="https://myrecoverysteps.com/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1800">
  <meta property="og:image:height" content="945">
  <meta property="og:image:alt" content="My Recovery Steps — tracking daily walking progress">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Recovery Steps">
  <meta name="twitter:description" content="Tracking daily walking progress · Powered by Strava">
  <meta name="twitter:image" content="https://myrecoverysteps.com/og-image.png">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(ellipse 110% 20% at 50% 44%, rgba(255,255,255,0.16)   0%, transparent 100%),
        radial-gradient(ellipse 80%  60% at 8%  30%, rgba(116,172,223,0.55)   0%, transparent 55%),
        radial-gradient(ellipse 55%  70% at 90% 10%, rgba(100,165,220,0.40)   0%, transparent 50%),
        radial-gradient(ellipse 70%  50% at 50% 90%, rgba(10, 40, 85, 0.90)   0%, transparent 65%),
        linear-gradient(155deg, #0f3d6b 0%, #1a6cb5 30%, #3b8fd4 65%, #74ACDF 100%);
      min-height: 100vh;
      padding: clamp(16px, 5vw, 44px) clamp(12px, 4vw, 32px);
    }

    #root { max-width: 1040px; margin: 0 auto; }

    /* ── Liquid Glass layers ── */
    .glass-shell {
      background: rgba(5, 30, 65, 0.72);
      backdrop-filter: blur(48px) saturate(190%) brightness(1.06);
      -webkit-backdrop-filter: blur(48px) saturate(190%) brightness(1.06);
      border: 1px solid rgba(116, 172, 223, 0.40);
      border-radius: 32px;
      box-shadow:
        0 16px 56px rgba(0, 0, 0, 0.38),
        0 3px 8px  rgba(0, 0, 0, 0.20),
        inset 0 2px 0   rgba(255, 255, 255, 0.18),
        inset 0 -1px 0  rgba(0, 0, 0, 0.10);
    }

    .glass-panel {
      background: rgba(10, 45, 100, 0.55);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(116, 172, 223, 0.35);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.18);
    }

    .glass-blue {
      background: rgba(10, 55, 120, 0.65);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      border: 1px solid rgba(116, 172, 223, 0.50);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(28, 63, 117, 0.30),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.18);
    }

    .glass-gold {
      background: rgba(80, 50, 5, 0.60);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      border: 1px solid rgba(246, 180, 14, 0.55);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(246, 180, 14, 0.20),
        0 0 28px  rgba(246, 180, 14, 0.10),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.15);
    }

    .glass-dim {
      background: rgba(10, 35, 80, 0.45);
      border: 1px solid rgba(116, 172, 223, 0.20);
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* ── Chart bar ── */
    .bar {
      background: linear-gradient(to top,
        rgba(100, 165, 220, 0.60) 0%,
        rgba(200, 232, 255, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 5px 5px 3px 3px;
      box-shadow:
        0 2px 10px rgba(116, 172, 223, 0.50),
        inset 0 1px 0  rgba(255, 255, 255, 0.60);
      transition: filter 0.2s;
    }
    .bar.is-max {
      background: linear-gradient(to top,
        rgba(246, 180, 14, 0.70) 0%,
        rgba(251, 218, 106, 0.98) 100%);
      box-shadow:
        0 2px 12px rgba(246, 180, 14, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    /* ── Responsive grids ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2vw, 16px);
    }
    @media (max-width: 500px) {
      .stat-grid {
        grid-template-columns: 1fr 1fr;
      }
      .stat-grid > *:last-child {
        grid-column: 1 / -1;
      }
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 2vw, 12px);
    }
    @media (max-width: 620px) { .badge-grid { grid-template-columns: repeat(2, 1fr); } }

    /* ── Scrollable chart ── */
    .chart-wrap { position: relative; }
    .chart-wrap.has-overflow::before,
    .chart-wrap.has-overflow::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30px;
      pointer-events: none;
      z-index: 3;
    }
    .chart-wrap.has-overflow::before { left: 0;  background: linear-gradient(to right, rgba(8,38,86,0.92), transparent); }
    .chart-wrap.has-overflow::after  { right: 0; background: linear-gradient(to left,  rgba(8,38,86,0.92), transparent); }

    .chart-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .chart-scroll::-webkit-scrollbar { display: none; }

    .scroll-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(160, 210, 255, 0.65);
      margin-top: 12px;
    }
    .scroll-hint svg { animation: nudge 1.8s ease-in-out infinite; }
    .scroll-hint .r svg { transform: scaleX(-1); }
    @keyframes nudge {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50%      { opacity: 1;   transform: translateX(2px); }
    }

    /* ── Calendar ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(5px, 1.4vw, 8px);
    }
    .cal-dow {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(160, 210, 255, 0.55);
      padding-bottom: 4px;
    }
    .cal-cell {
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cal-num { font-size: clamp(10px, 2vw, 13px); font-weight: 600; line-height: 1; }
    .cal-dist { font-size: 8px; font-weight: 700; margin-top: 2px; line-height: 1; }
    .cal-twice {
      position: absolute;
      top: 4px;
      right: 5px;
      font-size: 8px;
      color: #FBDA6A;
      line-height: 1;
    }
    .cal-today { outline: 2px solid rgba(251, 218, 106, 0.85); outline-offset: 1px; }

    /* ── Wordmark ── */
    .wordmark { display: flex; align-items: center; gap: clamp(12px, 3vw, 16px); }
    .wordmark-badge {
      width: clamp(52px, 12vw, 68px);
      height: clamp(52px, 12vw, 68px);
      flex: 0 0 auto;
      border-radius: 17px;
      overflow: hidden;
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.40),
        0 2px 6px rgba(0, 0, 0, 0.25);
    }
    .wordmark-eyebrow {
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(251, 218, 106, 0.85);
      margin-bottom: 3px;
    }
    .wordmark-title {
      font-size: clamp(26px, 6.5vw, 40px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 0.95;
      background: linear-gradient(115deg, #FFFFFF 0%, #E8F4FF 38%, #74ACDF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    /* ── BETA pill ── */
    .beta-pill {
      display: inline-block;
      margin-left: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      background: rgba(116, 172, 223, 0.28);
      border: 1px solid rgba(116, 172, 223, 0.45);
      border-radius: 6px;
      padding: 2px 7px;
      color: rgba(190, 225, 255, 0.92);
      vertical-align: middle;
      position: relative;
      top: -3px;
    }

    /* ── Badge glow ── */
    .badge-glow {
      box-shadow:
        0 6px 24px rgba(246, 180, 14, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.35);
    }

    /* ── Collapsible section header ── */
    .section-toggle {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .section-toggle:hover { background: rgba(116, 172, 223, 0.06); }

    .chevron-icon {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    .chevron-icon.open { transform: rotate(90deg); }

    /* ── Badge filter tabs ── */
    .badge-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .badge-filter-tab {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 5px 13px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(116, 172, 223, 0.28);
      background: rgba(10, 45, 100, 0.35);
      color: rgba(160, 210, 255, 0.70);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .badge-filter-tab:hover {
      background: rgba(10, 55, 120, 0.55);
      color: rgba(200, 232, 255, 0.90);
    }
    .badge-filter-tab.active {
      background: rgba(246, 180, 14, 0.18);
      border-color: rgba(246, 180, 14, 0.55);
      color: #FBDA6A;
    }

    /* ── Latest-badge spotlight (collapsed state) ── */
    .latest-badge-spotlight {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(80, 50, 5, 0.45);
      border: 1px solid rgba(246, 180, 14, 0.40);
      box-shadow: 0 4px 16px rgba(246, 180, 14, 0.12), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .latest-badge-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      border-radius: 14px;
      background: rgba(246, 180, 14, 0.14);
      border: 1px solid rgba(246, 180, 14, 0.40);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Badge "Latest" label ── */
    .badge-latest-pill {
      display: inline-block;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: rgba(246, 180, 14, 0.20);
      border: 1px solid rgba(246, 180, 14, 0.45);
      border-radius: 5px;
      padding: 2px 6px;
      color: #FBDA6A;
      margin-bottom: 4px;
    }

    /* ── Insights ── */
    .insight-list { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 11px; }
    .insight-list li {
      display: flex;
      gap: 11px;
      font-size: clamp(12px, 2vw, 14px);
      line-height: 1.6;
      color: rgba(220, 238, 255, 0.92);
    }
    .insight-list li .ico {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(246, 180, 14, 0.16);
      border: 1px solid rgba(246, 180, 14, 0.40);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .insight-list li b { color: #FBDA6A; font-weight: 700; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="app.js" defer></script>
</body>
</html>
