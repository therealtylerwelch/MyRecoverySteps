<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyRecoverySteps</title>

  <!-- Favicons: SVG for crisp modern browsers, ICO/PNG fallbacks -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <!-- iOS homescreen icon (solid square; iOS applies corner radius) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Android / PWA -->
  <link rel="manifest" href="site.webmanifest">

  <!-- iOS web-app appearance when launched from homescreen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyRecoverySteps">
  <meta name="theme-color" content="#74ACDF">

  <!-- SEO -->
  <meta name="description" content="Tracking daily walking progress · Powered by Strava">

  <!-- Open Graph (iMessage, Facebook, LinkedIn, Slack…) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="My Recovery Steps">
  <meta property="og:title" content="My Recovery Steps">
  <meta property="og:description" content="Tracking daily walking progress · Powered by Strava">
  <meta property="og:url" content="https://myrecoverysteps.com/">
  <meta property="og:image" content="https://myrecoverysteps.com/og-image.png">
  <meta property="og:image:secure_url" content="https://myrecoverysteps.com/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1800">
  <meta property="og:image:height" content="945">
  <meta property="og:image:alt" content="My Recovery Steps — tracking daily walking progress">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Recovery Steps">
  <meta name="twitter:description" content="Tracking daily walking progress · Powered by Strava">
  <meta name="twitter:image" content="https://myrecoverysteps.com/og-image.png">

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(ellipse 110% 20% at 50% 44%, rgba(255,255,255,0.16)   0%, transparent 100%),
        radial-gradient(ellipse 80%  60% at 8%  30%, rgba(116,172,223,0.55)   0%, transparent 55%),
        radial-gradient(ellipse 55%  70% at 90% 10%, rgba(100,165,220,0.40)   0%, transparent 50%),
        radial-gradient(ellipse 70%  50% at 50% 90%, rgba(10, 40, 85, 0.90)   0%, transparent 65%),
        linear-gradient(155deg, #0f3d6b 0%, #1a6cb5 30%, #3b8fd4 65%, #74ACDF 100%);
      min-height: 100vh;
      padding: clamp(16px, 5vw, 44px) clamp(12px, 4vw, 32px);
    }

    #root { max-width: 1040px; margin: 0 auto; }

    /* ── Liquid Glass layers ── */
    .glass-shell {
      background: rgba(5, 30, 65, 0.72);
      backdrop-filter: blur(48px) saturate(190%) brightness(1.06);
      -webkit-backdrop-filter: blur(48px) saturate(190%) brightness(1.06);
      border: 1px solid rgba(116, 172, 223, 0.40);
      border-radius: 32px;
      box-shadow:
        0 16px 56px rgba(0, 0, 0, 0.38),
        0 3px 8px  rgba(0, 0, 0, 0.20),
        inset 0 2px 0   rgba(255, 255, 255, 0.18),
        inset 0 -1px 0  rgba(0, 0, 0, 0.10);
    }

    .glass-panel {
      background: rgba(10, 45, 100, 0.55);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(116, 172, 223, 0.35);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.18);
    }

    .glass-blue {
      background: rgba(10, 55, 120, 0.65);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      border: 1px solid rgba(116, 172, 223, 0.50);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(28, 63, 117, 0.30),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.18);
    }

    .glass-gold {
      background: rgba(80, 50, 5, 0.60);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      border: 1px solid rgba(246, 180, 14, 0.55);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(246, 180, 14, 0.20),
        0 0 28px  rgba(246, 180, 14, 0.10),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.15);
    }

    .glass-dim {
      background: rgba(10, 35, 80, 0.45);
      border: 1px solid rgba(116, 172, 223, 0.20);
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* ── Chart bar ── */
    .bar {
      background: linear-gradient(to top,
        rgba(100, 165, 220, 0.60) 0%,
        rgba(200, 232, 255, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 5px 5px 3px 3px;
      box-shadow:
        0 2px 10px rgba(116, 172, 223, 0.50),
        inset 0 1px 0  rgba(255, 255, 255, 0.60);
      transition: filter 0.2s;
    }
    .bar.is-max {
      background: linear-gradient(to top,
        rgba(246, 180, 14, 0.70) 0%,
        rgba(251, 218, 106, 0.98) 100%);
      box-shadow:
        0 2px 12px rgba(246, 180, 14, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    /* ── Responsive grids ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2vw, 16px);
    }
    @media (max-width: 500px) {
      .stat-grid {
        grid-template-columns: 1fr 1fr;
      }
      .stat-grid > *:last-child {
        grid-column: 1 / -1;
      }
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 2vw, 12px);
    }
    @media (max-width: 620px) { .badge-grid { grid-template-columns: repeat(2, 1fr); } }

    /* ── Scrollable chart ── */
    .chart-wrap { position: relative; }
    .chart-wrap.has-overflow::before,
    .chart-wrap.has-overflow::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 30px;
      pointer-events: none;
      z-index: 3;
    }
    .chart-wrap.has-overflow::before { left: 0;  background: linear-gradient(to right, rgba(8,38,86,0.92), transparent); }
    .chart-wrap.has-overflow::after  { right: 0; background: linear-gradient(to left,  rgba(8,38,86,0.92), transparent); }

    .chart-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .chart-scroll::-webkit-scrollbar { display: none; }

    .scroll-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(160, 210, 255, 0.65);
      margin-top: 12px;
    }
    .scroll-hint svg { animation: nudge 1.8s ease-in-out infinite; }
    .scroll-hint .r svg { transform: scaleX(-1); }
    @keyframes nudge {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50%      { opacity: 1;   transform: translateX(2px); }
    }

    /* ── Calendar ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(5px, 1.4vw, 8px);
    }
    .cal-dow {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(160, 210, 255, 0.55);
      padding-bottom: 4px;
    }
    .cal-cell {
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cal-num { font-size: clamp(10px, 2vw, 13px); font-weight: 600; line-height: 1; }
    .cal-dist { font-size: 8px; font-weight: 700; margin-top: 2px; line-height: 1; }
    .cal-twice {
      position: absolute;
      top: 4px;
      right: 5px;
      font-size: 8px;
      color: #FBDA6A;
      line-height: 1;
    }
    .cal-today { outline: 2px solid rgba(251, 218, 106, 0.85); outline-offset: 1px; }

    /* ── Wordmark ── */
    .wordmark { display: flex; align-items: center; gap: clamp(12px, 3vw, 16px); }
    .wordmark-badge {
      width: clamp(46px, 11vw, 60px);
      height: clamp(46px, 11vw, 60px);
      flex: 0 0 auto;
      border-radius: 17px;
      background: linear-gradient(145deg, #FBDA6A 0%, #F6B40E 60%, #E09A00 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 8px 22px rgba(246, 180, 14, 0.38),
        inset 0 2px 0 rgba(255, 255, 255, 0.55),
        inset 0 -2px 4px rgba(160, 110, 0, 0.30);
    }
    .wordmark-eyebrow {
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(251, 218, 106, 0.85);
      margin-bottom: 3px;
    }
    .wordmark-title {
      font-size: clamp(26px, 6.5vw, 40px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 0.95;
      background: linear-gradient(115deg, #FFFFFF 0%, #E8F4FF 38%, #74ACDF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    /* ── BETA pill ── */
    .beta-pill {
      display: inline-block;
      margin-left: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      background: rgba(116, 172, 223, 0.28);
      border: 1px solid rgba(116, 172, 223, 0.45);
      border-radius: 6px;
      padding: 2px 7px;
      color: rgba(190, 225, 255, 0.92);
      vertical-align: middle;
      position: relative;
      top: -3px;
    }

    /* ── Badge glow ── */
    .badge-glow {
      box-shadow:
        0 6px 24px rgba(246, 180, 14, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.35);
    }

    /* ── Insights ── */
    .insight-list { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 11px; }
    .insight-list li {
      display: flex;
      gap: 11px;
      font-size: clamp(12px, 2vw, 14px);
      line-height: 1.6;
      color: rgba(220, 238, 255, 0.92);
    }
    .insight-list li .ico {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(246, 180, 14, 0.16);
      border: 1px solid rgba(246, 180, 14, 0.40);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .insight-list li b { color: #FBDA6A; font-weight: 700; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const W  = (a) => `rgba(255,255,255,${a})`;
    const GOLD       = '#F6B40E';
    const GOLD_LIGHT = '#FBDA6A';
    const BLUE_LIGHT = '#E8F4FF';
    const BLUE_MID   = '#74ACDF';
    const BLUE_DIM   = 'rgba(160, 210, 255, 0.80)';
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    /* ── Modern monoline badge / UI icons ── */
    const Icon = ({ name, c = '#fff', size = 30, sw = 1.8 }) => {
      const base = { width: size, height: size, display: 'block' };
      const s = { fill: 'none', stroke: c, strokeWidth: sw, strokeLinecap: 'round', strokeLinejoin: 'round' };
      const t = { fill: c, stroke: 'none' };
      switch (name) {
        case 'footprints':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              {/* back foot (lower-left) */}
              <ellipse {...t} cx="8" cy="15" rx="2.4" ry="3.4"/>
              <circle {...t} cx="5.8" cy="10.2" r="0.95"/>
              <circle {...t} cx="8" cy="9.1" r="1.05"/>
              <circle {...t} cx="10.1" cy="10" r="0.9"/>
              {/* front foot (upper-right) */}
              <ellipse {...t} cx="16" cy="11" rx="2.4" ry="3.4"/>
              <circle {...t} cx="13.9" cy="6.2" r="0.9"/>
              <circle {...t} cx="16" cy="5.1" r="1.05"/>
              <circle {...t} cx="18.1" cy="6" r="0.95"/>
            </svg>
          );
        case 'shield':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <path {...s} d="M12 3l7 2.6v4.9c0 4.4-3 7.4-7 8.9-4-1.5-7-4.5-7-8.9V5.6L12 3Z"/>
              <path {...s} d="M12.6 8.2l-2.4 4h2.4l-1.2 3.6 3.4-4.6h-2.4L12.6 8.2Z"/>
            </svg>
          );
        case 'crown':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <path {...s} d="M4 8.5l3.4 3 4.6-6 4.6 6 3.4-3v9.5H4V8.5Z"/>
              <path {...s} d="M4 18.5h16"/>
              <circle {...t} cx="12" cy="9.6" r="1"/>
            </svg>
          );
        case 'flame':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <path {...s} d="M12.5 3c.5 2.6 2.3 3.6 3.2 5.4.7 1.4.8 3 .2 4.4A4.7 4.7 0 0 1 7 12.4c0-1.5.6-2.6 1.4-3.5.3 1 .9 1.6 1.7 1.7-.7-2.6.4-5.3 2.4-7.6Z"/>
            </svg>
          );
        case 'sparkles':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <path {...s} d="M8 4l1.1 3L12 8l-2.9 1L8 12l-1.1-3L4 8l2.9-1L8 4Z"/>
              <path {...s} d="M16.5 12l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/>
            </svg>
          );
        case 'flag':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <path {...s} d="M6 3v18"/>
              <path {...s} d="M6 4.5h12l-2.4 3.3L18 11H6"/>
              <path {...s} d="M9 4.5v6.5M12 4.5v6.5"/>
            </svg>
          );
        case 'medal':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <path {...s} d="M8.5 3l2 5M15.5 3l-2 5"/>
              <circle {...s} cx="12" cy="14.5" r="6"/>
            </svg>
          );
        case 'arrow':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <path {...s} d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          );
        case 'chevron':
          return (
            <svg viewBox="0 0 24 24" style={{ width: size, height: size, display: 'block' }}>
              <path {...s} d="M9 6l6 6-6 6"/>
            </svg>
          );
        case 'bolt':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <path {...s} d="M13 3l-7 9h5l-1 9 7-10h-5l1-8Z"/>
            </svg>
          );
        case 'target':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <circle {...s} cx="12" cy="12" r="8"/><circle {...s} cx="12" cy="12" r="4"/><circle {...t} cx="12" cy="12" r="1.3"/>
            </svg>
          );
        case 'layers':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <path {...s} d="M12 4l8 4-8 4-8-4 8-4Z"/><path {...s} d="M4 12l8 4 8-4M4 16l8 4 8-4"/>
            </svg>
          );
        case 'calendar':
          return (
            <svg viewBox="0 0 24 24" style={base}>
              <rect {...s} x="4" y="5" width="16" height="15" rx="2.5"/>
              <path {...s} d="M4 9h16M8 3v4M16 3v4"/>
            </svg>
          );
        default:
          return null;
      }
    };

    /* ── Medal icon with a number baked in (mile clubs) ── */
    const MileIcon = ({ value, c, size = 30 }) => (
      <svg viewBox="0 0 24 24" style={{ width: size, height: size, display: 'block' }}>
        <path d="M8.5 3l2 5M15.5 3l-2 5" fill="none" stroke={c} strokeWidth="1.8" strokeLinecap="round" />
        <circle cx="12" cy="14.5" r="6.3" fill="none" stroke={c} strokeWidth="1.8" />
        <text x="12" y="16.6" textAnchor="middle" fontSize={value >= 100 ? 5 : 6.4} fontWeight="700" fill={c} stroke="none" fontFamily="-apple-system, sans-serif">{value}</text>
      </svg>
    );

    const BadgeArt = ({ icon, value, color, size }) => (
      value != null
        ? <MileIcon value={value} c={color} size={size} />
        : <Icon name={icon} c={color} size={size} />
    );

    const StatCard = ({ label, value, unit, variant }) => {
      const isGold = variant === 'gold';
      return (
        <div
          className={isGold ? 'glass-gold' : 'glass-blue'}
          style={{ padding: 'clamp(14px, 3vw, 22px)', textAlign: 'center', borderRadius: '18px' }}
        >
          <div style={{ fontSize: 'clamp(10px, 2vw, 12px)', color: isGold ? 'rgba(251,218,106,0.80)' : BLUE_DIM, fontWeight: 600, letterSpacing: '0.5px', marginBottom: '8px', textTransform: 'uppercase' }}>
            {label}
          </div>
          <div style={{ fontSize: 'clamp(30px, 6vw, 40px)', fontWeight: 200, color: isGold ? GOLD_LIGHT : BLUE_LIGHT, letterSpacing: '-1.5px', lineHeight: 1, marginBottom: '6px' }}>
            {value}
          </div>
          <div style={{ fontSize: 'clamp(10px, 1.8vw, 12px)', color: isGold ? 'rgba(251,218,106,0.90)' : BLUE_MID, fontWeight: 500 }}>
            {unit}
          </div>
        </div>
      );
    };

    const SectionTitle = ({ icon, children, right }) => (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '9px' }}>
          <Icon name={icon} c={BLUE_MID} size={18} sw={2} />
          <h2 style={{ fontSize: 'clamp(12px, 2.5vw, 15px)', fontWeight: 600, color: BLUE_LIGHT, textTransform: 'uppercase', letterSpacing: '0.5px' }}>{children}</h2>
        </div>
        {right}
      </div>
    );

    /* ── Monthly calendar ── */
    const Calendar = ({ year, monthIndex, activeMap, twiceDays, today }) => {
      const firstDow    = new Date(year, monthIndex, 1).getDay();
      const daysInMonth = new Date(year, monthIndex + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < firstDow; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      return (
        <div className="glass-panel" style={{ padding: 'clamp(14px, 3vw, 20px)', marginBottom: 'clamp(14px, 3vw, 22px)', borderRadius: '18px' }}>
          <SectionTitle
            icon="calendar"
            right={<span style={{ fontSize: '12px', fontWeight: 600, color: GOLD_LIGHT }}>{MONTHS[monthIndex]} {year}</span>}
          >
            Activity Calendar
          </SectionTitle>
          <div className="cal-grid" style={{ marginBottom: '8px' }}>
            {['S','M','T','W','T','F','S'].map((d, i) => <div key={i} className="cal-dow">{d}</div>)}
          </div>
          <div className="cal-grid">
            {cells.map((d, i) => {
              if (d === null) return <div key={i} />;
              const dist   = activeMap[d];
              const active = dist != null;
              const twice  = twiceDays.includes(d);
              const isToday = d === today;
              return (
                <div
                  key={i}
                  className={'cal-cell ' + (active ? 'glass-gold' : 'glass-dim') + (isToday ? ' cal-today' : '')}
                  style={{ opacity: active ? 1 : 0.5 }}
                >
                  {twice && <span className="cal-twice">✦</span>}
                  <span className="cal-num" style={{ color: active ? GOLD_LIGHT : BLUE_DIM }}>{d}</span>
                  {active && <span className="cal-dist" style={{ color: 'rgba(251,218,106,0.85)' }}>{dist.toFixed(1)}</span>}
                </div>
              );
            })}
          </div>
          <div style={{ display: 'flex', gap: '16px', marginTop: '14px', fontSize: '10px', color: BLUE_DIM, fontWeight: 500 }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span style={{ width: '10px', height: '10px', borderRadius: '3px', background: 'rgba(246,180,14,0.55)', border: '1px solid rgba(246,180,14,0.7)' }} /> Walked
            </span>
            <span style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
              <span style={{ color: GOLD_LIGHT, fontSize: '11px' }}>✦</span> Two walks
            </span>
          </div>
        </div>
      );
    };

    const MiniStat = ({ icon, label, value, unit }) => (
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '11px', padding: '12px 14px', borderRadius: '14px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(116,172,223,0.22)' }}>
        <div style={{ width: '34px', height: '34px', flex: '0 0 auto', borderRadius: '10px', background: 'rgba(116,172,223,0.16)', border: '1px solid rgba(116,172,223,0.35)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <Icon name={icon} c={BLUE_LIGHT} size={18} sw={2} />
        </div>
        <div>
          <div style={{ fontSize: '10px', color: BLUE_DIM, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.4px' }}>{label}</div>
          <div style={{ fontSize: 'clamp(16px, 3vw, 19px)', fontWeight: 300, color: BLUE_LIGHT, lineHeight: 1.1 }}>
            {value} <span style={{ fontSize: '11px', color: BLUE_MID, fontWeight: 500 }}>{unit}</span>
          </div>
        </div>
      </div>
    );

    const WalkTracker = () => {
      const realData = {
        year: 2026,
        monthIndex: 5,          // June (0-based)
        today: 29,
        updated: 'June 29, 2026',
        currentStreak: 1,
        longestStreak: 5,
        longestStreakLabel: 'Jun 7–11',
        totalWalks: 19,
        activeDays: 18,
        totalDistance: 10.7,
        twiceDailyDays: [11],
        lastActivity: { date: '2026-06-29', distance: 0.89, duration: 1567, pace: 29.3 },
        dailyData: [
          { date: 'Jun 3',  distance: 0.33 },
          { date: 'Jun 4',  distance: 0.33 },
          { date: 'Jun 5',  distance: 0.30 },
          { date: 'Jun 7',  distance: 0.36 },
          { date: 'Jun 8',  distance: 1.02 },
          { date: 'Jun 9',  distance: 0.33 },
          { date: 'Jun 10', distance: 0.36 },
          { date: 'Jun 11', distance: 0.69 },
          { date: 'Jun 13', distance: 0.81 },
          { date: 'Jun 15', distance: 0.59 },
          { date: 'Jun 16', distance: 0.61 },
          { date: 'Jun 17', distance: 0.39 },
          { date: 'Jun 18', distance: 0.59 },
          { date: 'Jun 23', distance: 0.62 },
          { date: 'Jun 24', distance: 0.55 },
          { date: 'Jun 25', distance: 1.01 },
          { date: 'Jun 27', distance: 0.93 },
          { date: 'Jun 29', distance: 0.89 }
        ],
        badges: [
          { id: 1, name: 'First Steps',     description: 'Complete your first walk',      unlocked: true,  icon: 'footprints' },
          { id: 2, name: '5-Day Warrior',   description: '5 consecutive days walked',     unlocked: true,  icon: 'shield' },
          { id: 3, name: 'Twice Daily',     description: '2 walks in one day',            unlocked: true,  icon: 'sparkles' },
          { id: 4, name: '10-Day Legend',   description: '10 consecutive days walked',    unlocked: false, icon: 'crown' },
          { id: 5, name: '14-Day Streak',   description: '14 consecutive days walked',    unlocked: false, icon: 'flame' },
          { id: 6, name: '25 Mile Club',    description: 'Walk 25+ miles total',          unlocked: false, mile: 25 },
          { id: 7, name: '50 Mile Club',    description: 'Walk 50+ miles total',          unlocked: false, mile: 50 },
          { id: 8, name: 'Marathon Master', description: 'Walk 26.2 miles total',         unlocked: false, icon: 'flag' },
          { id: 9, name: '100 Mile Club',   description: 'Walk 100+ miles total',         unlocked: false, mile: 100 }
        ]
      };

      const [data] = React.useState(realData);
      const scrollRef = React.useRef(null);
      const [overflow, setOverflow] = React.useState(false);
      React.useEffect(() => {
        const check = () => {
          const e = scrollRef.current;
          if (e) setOverflow(e.scrollWidth > e.clientWidth + 4);
        };
        check();
        window.addEventListener('resize', check);
        return () => window.removeEventListener('resize', check);
      }, []);

      const unlockedCount = data.badges.filter(b => b.unlocked).length;
      const dists         = data.dailyData.map(d => d.distance);
      const maxDistance   = Math.max(...dists);
      const avgDistance   = dists.reduce((a, b) => a + b, 0) / dists.length;
      const pct           = (data.totalDistance / 100) * 100;

      const activeMap = {};
      data.dailyData.forEach(d => { activeMap[parseInt(d.date.split(' ')[1], 10)] = d.distance; });

      return (
        <div className="glass-shell" style={{ padding: 'clamp(20px, 4vw, 40px)' }}>

          {/* ── Header / wordmark ── */}
          <div style={{ marginBottom: 'clamp(20px, 4vw, 36px)' }}>
            <div className="wordmark">
              <div className="wordmark-badge">
                <Icon name="footprints" c="#0f3d6b" size={30} sw={2} />
              </div>
              <div>
                <div className="wordmark-eyebrow">My Recovery</div>
                <span className="wordmark-title">STEPS</span>
                <span className="beta-pill">BETA</span>
              </div>
            </div>
            <p style={{ fontSize: 'clamp(12px, 2.5vw, 14px)', color: BLUE_MID, fontWeight: 400, lineHeight: 1.55, marginTop: '12px' }}>
              Tracking daily walking progress · Powered by Strava MCP + Claude Opus 4.8
            </p>
          </div>

          {/* ── Stats ── */}
          <div className="stat-grid" style={{ marginBottom: 'clamp(14px, 3vw, 22px)' }}>
            <StatCard label="Current Streak"  value={data.currentStreak}                   unit="days in a row"   variant="blue" />
            <StatCard label="Total Distance"  value={data.totalDistance.toFixed(1)}         unit="miles since Jun 1" variant="blue" />
            <StatCard label="To 100 Miles"    value={(100 - data.totalDistance).toFixed(1)} unit="miles away"      variant="gold" />
          </div>

          {/* ── Progress bar ── */}
          <div className="glass-panel" style={{ padding: 'clamp(14px, 3vw, 20px)', marginBottom: 'clamp(14px, 3vw, 22px)', borderRadius: '18px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '10px' }}>
              <span style={{ fontSize: 'clamp(11px, 2vw, 13px)', color: BLUE_LIGHT, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.5px' }}>100-Mile Goal</span>
              <span style={{ fontSize: 'clamp(11px, 2vw, 13px)', color: GOLD_LIGHT, fontWeight: 600 }}>{pct.toFixed(1)}%</span>
            </div>
            <div style={{ height: '8px', borderRadius: '100px', background: 'rgba(255,255,255,0.10)', overflow: 'hidden', border: '1px solid rgba(255,255,255,0.12)' }}>
              <div style={{
                height: '100%',
                width: `${pct}%`,
                borderRadius: '100px',
                background: `linear-gradient(90deg, rgba(116,172,223,0.85) 0%, rgba(246,180,14,0.92) 100%)`,
                boxShadow: '0 0 14px rgba(246,180,14,0.45)',
                transition: 'width 0.6s ease'
              }} />
            </div>
          </div>

          {/* ── Calendar ── */}
          <Calendar
            year={data.year}
            monthIndex={data.monthIndex}
            activeMap={activeMap}
            twiceDays={data.twiceDailyDays}
            today={data.today}
          />

          {/* ── Daily Distance Trend ── */}
          <div className="glass-panel" style={{ padding: 'clamp(14px, 3vw, 20px)', marginBottom: 'clamp(14px, 3vw, 22px)', borderRadius: '18px' }}>
            <SectionTitle icon="bolt">Daily Distance Trend</SectionTitle>

            <div style={{ display: 'flex', gap: 'clamp(8px, 2vw, 12px)', marginBottom: '16px', flexWrap: 'wrap' }}>
              <MiniStat icon="target" label="Average / day" value={avgDistance.toFixed(2)} unit="mi" />
              <MiniStat icon="medal"  label="Longest walk"  value={maxDistance.toFixed(2)} unit="mi" />
            </div>

            <div className={'chart-wrap' + (overflow ? ' has-overflow' : '')}>
              <div className="chart-scroll" ref={scrollRef}>
                <div style={{ display: 'flex', alignItems: 'flex-end', gap: '6px', height: '160px', minWidth: 'min-content', padding: '0 4px' }}>
                  {data.dailyData.map((day, idx) => (
                    <div key={idx} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flex: '0 0 auto', minWidth: '34px' }}>
                      <div style={{ fontSize: '8px', color: day.distance === maxDistance ? GOLD_LIGHT : BLUE_LIGHT, fontWeight: 700, marginBottom: '3px', height: '12px', textAlign: 'center' }}>
                        {day.distance}
                      </div>
                      <div
                        className={'bar' + (day.distance === maxDistance ? ' is-max' : '')}
                        style={{ width: '18px', height: `${(day.distance / maxDistance) * 120}px`, minHeight: '6px' }}
                      />
                      <div style={{ fontSize: '8px', color: BLUE_DIM, marginTop: '5px', fontWeight: 500, textAlign: 'center' }}>
                        {day.date.split(' ')[1]}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {overflow && (
              <div className="scroll-hint">
                <span className="l"><Icon name="chevron" c="rgba(160,210,255,0.65)" size={13} sw={2.4} /></span>
                Scroll to see all {data.dailyData.length} days
                <span className="r"><Icon name="chevron" c="rgba(160,210,255,0.65)" size={13} sw={2.4} /></span>
              </div>
            )}
          </div>

          {/* ── Badges ── */}
          <div style={{ marginBottom: 'clamp(14px, 3vw, 22px)' }}>
            <SectionTitle
              icon="crown"
              right={
                <span style={{
                  fontSize: '12px', fontWeight: 500, color: GOLD,
                  background: 'rgba(203,161,53,0.15)',
                  border: '1px solid rgba(203,161,53,0.32)',
                  borderRadius: '20px', padding: '3px 11px'
                }}>
                  {unlockedCount} / {data.badges.length}
                </span>
              }
            >
              Badges Earned
            </SectionTitle>
            <div className="badge-grid">
              {data.badges.map(badge => {
                const col = badge.unlocked ? GOLD_LIGHT : BLUE_DIM;
                return (
                  <div
                    key={badge.id}
                    className={badge.unlocked ? 'glass-gold badge-glow' : 'glass-dim'}
                    style={{
                      padding: 'clamp(10px, 2.5vw, 16px)',
                      borderRadius: '16px',
                      textAlign: 'center',
                      opacity: badge.unlocked ? 1 : 0.6,
                    }}
                  >
                    <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '8px' }}>
                      <BadgeArt icon={badge.icon} value={badge.mile} color={col} size={30} />
                    </div>
                    <div style={{ fontSize: 'clamp(10px, 1.8vw, 12px)', fontWeight: 700, color: col, marginBottom: '4px', lineHeight: 1.2 }}>
                      {badge.name}
                    </div>
                    <div style={{ fontSize: '10px', color: badge.unlocked ? 'rgba(251,218,106,0.75)' : BLUE_DIM, lineHeight: 1.35 }}>{badge.description}</div>
                    {badge.unlocked && (
                      <div style={{ marginTop: '7px', fontSize: '10px', color: GOLD, fontWeight: 600, letterSpacing: '0.3px' }}>✓ Unlocked</div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* ── Recovery Insights ── */}
          <div className="glass-blue" style={{ padding: 'clamp(16px, 3vw, 24px)', borderRadius: '20px' }}>
            <SectionTitle icon="target">Recovery Insights</SectionTitle>
            <p style={{ fontSize: 'clamp(12px, 2vw, 14px)', color: BLUE_LIGHT, lineHeight: 1.75, fontWeight: 400 }}>
              Strong, steady recovery so far. You've logged <b style={{ color: GOLD_LIGHT }}>19 walks across 18 days</b> for <b style={{ color: GOLD_LIGHT }}>10.7 miles</b> since June 1, and the trend is clearly upward: your typical walk has grown from about <b style={{ color: GOLD_LIGHT }}>0.33 mi</b> early on to roughly <b style={{ color: GOLD_LIGHT }}>0.9–1.0 mi</b> in your last three outings, while your pace has improved from ~38 to ~31 min/mi — about <b style={{ color: GOLD_LIGHT }}>18% faster</b>. Your best stretch was a 5-day streak (Jun 7–11).
            </p>
            <p style={{ fontSize: 'clamp(12px, 2vw, 14px)', color: BLUE_LIGHT, lineHeight: 1.75, fontWeight: 400, marginTop: '12px' }}>
              The single biggest lever now is <b style={{ color: GOLD_LIGHT }}>consistency, not distance</b>. The gaps on Jun 6, 12, 14, 19–22, 26 and 28 are what keep resetting your streak — the four-day pause (Jun 19–22) alone broke what could have been a 3-week run. Here's how to convert your rising fitness into bigger milestones:
            </p>
            <ul className="insight-list">
              <li>
                <span className="ico"><Icon name="shield" c={GOLD_LIGHT} size={14} sw={2} /></span>
                <span><b>Set a daily floor.</b> On low-energy days, do a 0.3–0.4 mi "minimum walk" instead of skipping. That one habit would have turned your 5-day streak into 20+ and is the fastest route to the 14-Day Streak badge.</span>
              </li>
              <li>
                <span className="ico"><Icon name="arrow" c={GOLD_LIGHT} size={14} sw={2} /></span>
                <span><b>Lock in 1 mile.</b> Your last three walks already average ~0.9 mi — round that up to a steady <b>1.0 mi/day</b> as your new baseline.</span>
              </li>
              <li>
                <span className="ico"><Icon name="layers" c={GOLD_LIGHT} size={14} sw={2} /></span>
                <span><b>Stack a second short walk.</b> You did it once (Jun 11). Adding a 0.3 mi second walk on 2–3 days a week adds ~3 miles a month with almost no extra fatigue.</span>
              </li>
              <li>
                <span className="ico"><Icon name="medal" c={GOLD_LIGHT} size={14} sw={2} /></span>
                <span><b>Next milestone: 25-Mile Club.</b> You're <b>14.3 miles away</b>. At a steady 1.0 mi/day that's about 2 weeks; at your current ~0.6 mi/day average it's closer to 3.5 weeks.</span>
              </li>
              <li>
                <span className="ico"><Icon name="bolt" c={GOLD_LIGHT} size={14} sw={2} /></span>
                <span><b>Keep one brisk walk weekly.</b> Your pace is trending faster — protect that gain with one slightly quicker walk each week while keeping the rest easy and recovery-paced.</span>
              </li>
            </ul>
          </div>

          {/* ── Last updated ── */}
          <div style={{ marginTop: 'clamp(20px, 4vw, 32px)', textAlign: 'center' }}>
            <span style={{ fontSize: '11px', color: 'rgba(116,172,223,0.55)', fontWeight: 400, letterSpacing: '0.3px' }}>
              Data updated · {data.updated}
            </span>
          </div>

          {/* ── Argentina flag footer ── */}
          <div style={{ marginTop: 'clamp(12px, 2vw, 18px)', textAlign: 'center' }}>
            <a
              href="https://www.youtube.com/@AFASeleccion"
              target="_blank"
              rel="noopener noreferrer"
              title="AFA Selección Argentina"
              style={{ display: 'inline-block', textDecoration: 'none', opacity: 0.85, transition: 'opacity 0.2s' }}
              onMouseEnter={e => e.currentTarget.style.opacity = '1'}
              onMouseLeave={e => e.currentTarget.style.opacity = '0.85'}
            >
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="48" height="32" style={{ display: 'block', borderRadius: '4px', boxShadow: '0 2px 8px rgba(0,0,0,0.35)' }}>
                <rect width="900" height="600" fill="#74ACDF"/>
                <rect y="200" width="900" height="200" fill="#fff"/>
                <circle cx="450" cy="300" r="60" fill="#F6B40E"/>
                <g fill="#F6B40E" stroke="#CD8B00" strokeWidth="2">
                  {[0,30,60,90,120,150,180,210,240,270,300,330,360].map((deg, i) => {
                    const rad = (deg * Math.PI) / 180;
                    const x1 = 450 + 62 * Math.cos(rad);
                    const y1 = 300 + 62 * Math.sin(rad);
                    const x2 = 450 + 90 * Math.cos(rad);
                    const y2 = 300 + 90 * Math.sin(rad);
                    return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} strokeWidth="6" stroke="#F6B40E"/>;
                  })}
                </g>
                <circle cx="450" cy="300" r="42" fill="#F6B40E"/>
                <circle cx="450" cy="300" r="30" fill="#CD8B00"/>
                <circle cx="450" cy="300" r="22" fill="#F6B40E"/>
              </svg>
            </a>
          </div>

        </div>
      );
    };

    ReactDOM.render(<WalkTracker />, document.getElementById('root'));
  </script>
</body>
</html>
