  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(ellipse 110% 20% at 50% 44%, rgba(255,255,255,0.16)   0%, transparent 100%),
        radial-gradient(ellipse 80%  60% at 8%  30%, rgba(116,172,223,0.55)   0%, transparent 55%),
        radial-gradient(ellipse 55%  70% at 90% 10%, rgba(100,165,220,0.40)   0%, transparent 50%),
        radial-gradient(ellipse 70%  50% at 50% 90%, rgba(10, 40, 85, 0.90)   0%, transparent 65%),
        linear-gradient(155deg, #0f3d6b 0%, #1a6cb5 30%, #3b8fd4 65%, #74ACDF 100%);
      min-height: 100vh;
      padding: clamp(16px, 5vw, 44px) clamp(12px, 4vw, 32px);
    }

    #root { max-width: 1040px; margin: 0 auto; }

    /* ── Liquid Glass layers ── */
    .glass-shell {
      background: rgba(5, 30, 65, 0.72);
      backdrop-filter: blur(48px) saturate(190%) brightness(1.06);
      -webkit-backdrop-filter: blur(48px) saturate(190%) brightness(1.06);
      border: 1px solid rgba(116, 172, 223, 0.40);
      border-radius: 32px;
      box-shadow:
        0 16px 56px rgba(0, 0, 0, 0.38),
        0 3px 8px  rgba(0, 0, 0, 0.20),
        inset 0 2px 0   rgba(255, 255, 255, 0.18),
        inset 0 -1px 0  rgba(0, 0, 0, 0.10);
    }

    .glass-panel {
      background: rgba(10, 45, 100, 0.55);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(116, 172, 223, 0.35);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.18);
    }

    .glass-blue {
      background: rgba(10, 55, 120, 0.65);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      border: 1px solid rgba(116, 172, 223, 0.50);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(28, 63, 117, 0.30),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.18);
    }

    .glass-gold {
      background: rgba(80, 50, 5, 0.60);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      border: 1px solid rgba(246, 180, 14, 0.55);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(246, 180, 14, 0.20),
        0 0 28px  rgba(246, 180, 14, 0.10),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.15);
    }

    .glass-dim {
      background: rgba(10, 35, 80, 0.45);
      border: 1px solid rgba(116, 172, 223, 0.20);
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* ── Chart bar ── */
    .bar {
      background: linear-gradient(to top,
        rgba(100, 165, 220, 0.60) 0%,
        rgba(200, 232, 255, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 5px 5px 3px 3px;
      box-shadow:
        0 2px 10px rgba(116, 172, 223, 0.50),
        inset 0 1px 0  rgba(255, 255, 255, 0.60);
      transition: filter 0.2s;
    }
    .bar.is-max {
      background: linear-gradient(to top,
        rgba(246, 180, 14, 0.70) 0%,
        rgba(251, 218, 106, 0.98) 100%);
      box-shadow:
        0 2px 12px rgba(246, 180, 14, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    /* ── Responsive grids ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2vw, 16px);
    }
    @media (max-width: 500px) {
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .stat-grid > *:last-child { grid-column: 1 / -1; }
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 2vw, 12px);
    }
    @media (max-width: 620px) { .badge-grid { grid-template-columns: repeat(2, 1fr); } }

    /* ── Scrollable chart ── */
    .chart-wrap { position: relative; }
    .chart-wrap.has-overflow::before,
    .chart-wrap.has-overflow::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 30px;
      pointer-events: none;
      z-index: 3;
    }
    .chart-wrap.has-overflow::before { left: 0;  background: linear-gradient(to right, rgba(8,38,86,0.92), transparent); }
    .chart-wrap.has-overflow::after  { right: 0; background: linear-gradient(to left,  rgba(8,38,86,0.92), transparent); }

    .chart-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .chart-scroll::-webkit-scrollbar { display: none; }

    .scroll-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(160, 210, 255, 0.65);
      margin-top: 12px;
    }
    .scroll-hint svg { animation: nudge 1.8s ease-in-out infinite; }
    .scroll-hint .r svg { transform: scaleX(-1); }
    @keyframes nudge {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50%      { opacity: 1;   transform: translateX(2px); }
    }

    /* ── Dancing flag ── */
    .flag-icon {
      animation: flag-sway 3.2s ease-in-out infinite;
      transform-origin: 50% 90%;
    }
    .flag-label {
      display: inline-block;
    }
    .flag-link:hover .flag-icon {
      animation: flag-dance 0.6s ease-in-out infinite;
    }
    .flag-link:hover .flag-label {
      animation: flag-bob 0.6s ease-in-out infinite;
      animation-delay: 0.08s;
    }
    @keyframes flag-sway {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(3deg); }
    }
    @keyframes flag-dance {
      0%   { transform: rotate(0deg)    translateY(0)    scale(1); }
      15%  { transform: rotate(-12deg)  translateY(-4px) scale(1.06); }
      30%  { transform: rotate(9deg)    translateY(0)    scale(0.95); }
      45%  { transform: rotate(-8deg)   translateY(-3px) scale(1.05); }
      60%  { transform: rotate(10deg)   translateY(1px)  scale(0.96); }
      75%  { transform: rotate(-6deg)   translateY(-2px) scale(1.03); }
      90%  { transform: rotate(4deg)    translateY(0)    scale(0.99); }
      100% { transform: rotate(0deg)    translateY(0)    scale(1); }
    }
    @keyframes flag-bob {
      0%, 100% { transform: translateY(0)    rotate(0deg); }
      25%      { transform: translateY(-2px) rotate(-3deg); }
      50%      { transform: translateY(0)    rotate(0deg); }
      75%      { transform: translateY(-2px) rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flag-icon, .flag-label { animation: none !important; }
    }

    /* ── Calendar ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(5px, 1.4vw, 8px);
    }
    .cal-dow {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(160, 210, 255, 0.55);
      padding-bottom: 4px;
    }
    .cal-cell {
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cal-num  { font-size: clamp(10px, 2vw, 13px); font-weight: 600; line-height: 1; }
    .cal-dist { font-size: 8px; font-weight: 700; margin-top: 2px; line-height: 1; }
    .cal-twice {
      position: absolute;
      top: 4px; right: 5px;
      font-size: 8px;
      color: #FBDA6A;
      line-height: 1;
    }
    .cal-today { outline: 2px solid rgba(251, 218, 106, 0.85); outline-offset: 1px; }

    /* ── Month nav arrows ── */
    .month-nav-btn {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: rgba(116, 172, 223, 0.14);
      border: 1px solid rgba(116, 172, 223, 0.30);
      transition: background 0.15s;
    }
    .month-nav-btn:hover { background: rgba(116, 172, 223, 0.28); }
    .month-nav-btn.disabled { opacity: 0.3; cursor: default; pointer-events: none; }

    /* ── Trend delta pill ── */
    .trend-delta {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 20px;
      padding: 2px 8px;
      letter-spacing: 0.2px;
    }
    .trend-delta.up {
      color: #FBDA6A;
      background: rgba(246, 180, 14, 0.18);
      border: 1px solid rgba(246, 180, 14, 0.45);
    }
    .trend-delta.down {
      color: rgba(190, 220, 255, 0.85);
      background: rgba(116, 172, 223, 0.14);
      border: 1px solid rgba(116, 172, 223, 0.30);
    }
    .trend-delta.flat {
      color: rgba(160, 210, 255, 0.70);
      background: rgba(116, 172, 223, 0.10);
      border: 1px solid rgba(116, 172, 223, 0.24);
    }

    /* ── Wordmark ── */
    .wordmark { display: flex; align-items: center; gap: clamp(12px, 3vw, 16px); }
    .wordmark-badge {
      width: clamp(52px, 12vw, 68px);
      height: clamp(52px, 12vw, 68px);
      flex: 0 0 auto;
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.40), 0 2px 6px rgba(0,0,0,0.25);
    }
    .wordmark-eyebrow {
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(251, 218, 106, 0.85);
      margin-bottom: 3px;
    }
    .wordmark-title {
      font-size: clamp(26px, 6.5vw, 40px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 0.95;
      background: linear-gradient(115deg, #FFFFFF 0%, #E8F4FF 38%, #74ACDF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    /* ── BETA pill ── */
    .beta-pill {
      display: inline-block;
      margin-left: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      background: rgba(116, 172, 223, 0.28);
      border: 1px solid rgba(116, 172, 223, 0.45);
      border-radius: 6px;
      padding: 2px 7px;
      color: rgba(190, 225, 255, 0.92);
      vertical-align: middle;
      position: relative;
      top: -3px;
    }

    /* ── Badge glow ── */
    .badge-glow {
      box-shadow:
        0 6px 24px rgba(246, 180, 14, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.35);
    }

    /* ── Collapsible section header ── */
    .section-toggle {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .section-toggle:hover { background: rgba(116, 172, 223, 0.06); }

    .chevron-icon {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    .chevron-icon.open { transform: rotate(90deg); }

    /* ── Badge filter tabs ── */
    .badge-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .badge-filter-tab {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 5px 13px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(116, 172, 223, 0.28);
      background: rgba(10, 45, 100, 0.35);
      color: rgba(160, 210, 255, 0.70);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .badge-filter-tab:hover {
      background: rgba(10, 55, 120, 0.55);
      color: rgba(200, 232, 255, 0.90);
    }
    .badge-filter-tab.active {
      background: rgba(246, 180, 14, 0.18);
      border-color: rgba(246, 180, 14, 0.55);
      color: #FBDA6A;
    }

    /* ── Latest-badge spotlight ── */
    .latest-badge-spotlight {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(80, 50, 5, 0.45);
      border: 1px solid rgba(246, 180, 14, 0.40);
      box-shadow: 0 4px 16px rgba(246, 180, 14, 0.12), inset 0 1px 0 rgba(255,255,255,0.12);
      position: relative;
    }

    /* ── Badge-unlock confetti ── */
    .confetti-piece {
      position: absolute;
      top: -10px;
      width: 6px;
      height: 10px;
      border-radius: 2px;
      animation: confetti-fall 1.6s ease-in forwards;
      pointer-events: none;
    }
    @keyframes confetti-fall {
      0%   { transform: translateY(0) rotate(0deg);    opacity: 1; }
      100% { transform: translateY(90px) rotate(360deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .confetti-piece { display: none; }
    }
    .latest-badge-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      border-radius: 14px;
      background: rgba(246, 180, 14, 0.14);
      border: 1px solid rgba(246, 180, 14, 0.40);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Badge "Latest" label ── */
    .badge-latest-pill {
      display: inline-block;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: rgb(43, 30, 6);
      border: 1px solid rgba(246, 180, 14, 0.70);
      border-radius: 5px;
      padding: 2px 6px;
      color: #FBDA6A;
      margin-bottom: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    /* ── Insights ── */
    .insight-list { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 11px; }
    .insight-list li {
      display: flex;
      gap: 11px;
      font-size: clamp(12px, 2vw, 14px);
      line-height: 1.6;
      color: rgba(220, 238, 255, 0.92);
    }
    .insight-list li .ico {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(246, 180, 14, 0.16);
      border: 1px solid rgba(246, 180, 14, 0.40);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .insight-list li b { color: #FBDA6A; font-weight: 700; }

    /* ── TL;DR card ── */
    .tldr-card {
      background: rgba(116, 172, 223, 0.10);
      border: 1px solid rgba(116, 172, 223, 0.30);
      border-radius: 16px;
      padding: clamp(14px, 3vw, 18px);
    }
    .tldr-pill {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(116, 172, 223, 0.22);
      border: 1px solid rgba(116, 172, 223, 0.45);
      border-radius: 6px;
      padding: 3px 9px;
      color: #BEE1FF;
      margin-bottom: 10px;
    }
    .tldr-headline {
      font-size: clamp(21px, 4.6vw, 29px);
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1.15;
      color: #FBDA6A;
    }
    .tldr-action {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(116, 172, 223, 0.20);
      font-size: clamp(12px, 2vw, 14px);
      line-height: 1.6;
      color: rgba(220, 238, 255, 0.92);
    }
    .tldr-action .ico {
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(246, 180, 14, 0.18);
      border: 1px solid rgba(246, 180, 14, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
  </style>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const GOLD       = '#F6B40E';
    const GOLD_LIGHT = '#FBDA6A';
    const BLUE_LIGHT = '#E8F4FF';
    const BLUE_MID   = '#74ACDF';
    const BLUE_DIM   = 'rgba(160, 210, 255, 0.80)';
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const DOW = ['S','M','T','W','T','F','S'];

    /* ── Date / trend helpers ── */
    const parseDataDate = (dateStr, year) => {
      const [mon, day] = dateStr.split(' ');
      return new Date(year, MONTHS.indexOf(mon), parseInt(day, 10));
    };

    const formatPace = (minPerMile) => {
      if (!isFinite(minPerMile) || minPerMile <= 0) return '—';
      const m = Math.floor(minPerMile);
      const s = Math.round((minPerMile - m) * 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    };

    const rollingAverage = (values, windowSize = 7) =>
      values.map((_, i) => {
        const start = Math.max(0, i - windowSize + 1);
        const slice = values.slice(start, i + 1);
        return slice.reduce((a, b) => a + b, 0) / slice.length;
      });

    /* ── Activity Trends metric config ── */
    const METRICS = {
      distance: { label: 'Distance',  unit: 'mi', fmt: v => v.toFixed(2),          axisLabel: '7-day distance average' },
      elevGain: { label: 'Elevation', unit: 'ft', fmt: v => Math.round(v).toString(), axisLabel: '7-day elevation average' },
      effort:   { label: 'Effort',    unit: '',   fmt: v => Math.round(v).toString(), axisLabel: '7-day effort average' },
    };

    const getWeekStart = (date) => {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() - d.getDay());
      return d;
    };

    const bucketByWeek = (days) => {
      const buckets = new Map();
      days.forEach(d => {
        const wk = getWeekStart(d.dateObj).getTime();
        if (!buckets.has(wk)) buckets.set(wk, []);
        buckets.get(wk).push(d);
      });
      return [...buckets.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([wk, wDays]) => {
          const totalDistance = wDays.reduce((a, d) => a + d.distance, 0);
          const totalDuration = wDays.reduce((a, d) => a + (d.duration || 0), 0);
          return {
            weekStart: new Date(wk),
            days: wDays,
            avgDistance: totalDistance / wDays.length,
            avgPace: totalDuration > 0 ? (totalDuration / 60) / totalDistance : null,
            totalDistance,
          };
        });
    };

    const Icon = ({ name, c = '#fff', size = 30, sw = 1.8 }) => {
      const base = { width: size, height: size, display: 'block' };
      const s = { fill: 'none', stroke: c, strokeWidth: sw, strokeLinecap: 'round', strokeLinejoin: 'round' };
      const t = { fill: c, stroke: 'none' };
      switch (name) {
        case 'footprints':
          return (

          <div className="glass-panel" style={{ padding: 'clamp(14px, 3vw, 20px)', marginBottom: 'clamp(14px, 3vw, 22px)', borderRadius: '18px' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: '10px' }}>
              <span style={{ fontSize: 'clamp(11px, 2vw, 13px)', color: BLUE_LIGHT, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.5px' }}>{goalMiles}-Mile Goal</span>
              <span style={{ fontSize: 'clamp(11px, 2vw, 13px)', color: GOLD_LIGHT, fontWeight: 600 }}>{pct.toFixed(1)}%</span>
            </div>
            <div style={{ height: '8px', borderRadius: '100px', background: 'rgba(255,255,255,0.10)', overflow: 'hidden', border: '1px solid rgba(255,255,255,0.12)' }}>
              <div style={{
                height: '100%',
                width: `${pct}%`,
                borderRadius: '100px',
                background: 'linear-gradient(90deg, rgba(116,172,223,0.85) 0%, rgba(246,180,14,0.92) 100%)',
                boxShadow: '0 0 14px rgba(246,180,14,0.45)',
                transition: 'width 0.6s ease'
              }} />
            </div>
          </div>

          {/* ── Activity Calendar: detailed month view, browse history via prev/next ── */}
          <div className="glass-panel" style={{ padding: 'clamp(14px, 3vw, 20px)', marginBottom: 'clamp(14px, 3vw, 22px)', borderRadius: '18px' }}>
            <SectionTitle icon="calendar">Activity Calendar</SectionTitle>

            <Calendar
              year={calendarMonth.year}
              monthIndex={calendarMonth.monthIndex}
              activeMap={monthActiveMap}
              twiceDays={monthTwiceDays}
              today={monthToday}
              onPrevMonth={goPrevMonth}
              onNextMonth={goNextMonth}
              canGoPrev={canGoPrevMonth}
              canGoNext={canGoNextMonth}
            />
          </div>

          {/* ── Activity Trends ── */}
          <div className="glass-panel" style={{ padding: 'clamp(14px, 3vw, 20px)', marginBottom: 'clamp(14px, 3vw, 22px)', borderRadius: '18px' }}>
            <SectionTitle icon="bolt">Activity Trends</SectionTitle>

            <div style={{ display: 'flex', gap: 'clamp(8px, 2vw, 12px)', marginBottom: '14px', flexWrap: 'wrap' }}>
              <MiniStat icon="medal"  label="Longest walk" value={longestWalkDist.toFixed(2)} unit="mi" />
              <MiniStat icon="target" label="Avg / walk"   value={avgPerWalk.toFixed(2)}      unit="mi" />
              <MiniStat icon="bolt"   label="Avg pace"     value={formatPace(avgPaceAll)}      unit="/mi" />
            </div>

            {thisWeek && (
              <div style={{ padding: '14px 16px', marginBottom: '16px', borderRadius: '14px', background: 'rgba(255,255,255,0.05)', border: '1px solid rgba(116,172,223,0.22)' }}>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '12px', flexWrap: 'wrap', gap: '6px' }}>
                  <span style={{ fontSize: '10px', color: BLUE_DIM, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.4px' }}>Week over Week</span>
                  {lastWeek && (
                    <span style={{ fontSize: '10px', color: BLUE_MID }}>{weekRangeLabel(thisWeek.weekStart)} vs {weekRangeLabel(lastWeek.weekStart)}</span>
                  )}
                </div>
                <div style={{ display: 'flex', gap: 'clamp(16px, 4vw, 28px)', flexWrap: 'wrap' }}>
                  <div>
                    <div style={{ fontSize: '10px', color: BLUE_DIM, fontWeight: 600, marginBottom: '3px' }}>Avg distance / day</div>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: '8px' }}>
                      <span style={{ fontSize: 'clamp(16px, 3vw, 19px)', fontWeight: 300, color: BLUE_LIGHT }}>
                        {thisWeek.avgDistance.toFixed(2)} <span style={{ fontSize: '11px', color: BLUE_MID, fontWeight: 500 }}>mi</span>
                      </span>
                      {distanceDeltaPct != null && (
                        <span className={'trend-delta ' + deltaClass(distanceDeltaPct)}>
                          {distanceDeltaPct >= 0 ? '▲' : '▼'} {Math.abs(distanceDeltaPct).toFixed(0)}%
                        </span>
                      )}
                    </div>
                  </div>
                  <div>
                    <div style={{ fontSize: '10px', color: BLUE_DIM, fontWeight: 600, marginBottom: '3px' }}>Avg pace</div>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: '8px' }}>
                      <span style={{ fontSize: 'clamp(16px, 3vw, 19px)', fontWeight: 300, color: BLUE_LIGHT }}>
                        {formatPace(thisWeek.avgPace)} <span style={{ fontSize: '11px', color: BLUE_MID, fontWeight: 500 }}>/mi</span>
                      </span>
                      {paceDeltaPct != null && (
                        <span className={'trend-delta ' + deltaClass(paceDeltaPct)}>
                          {paceDeltaPct >= 0 ? '▲' : '▼'} {Math.abs(paceDeltaPct).toFixed(0)}%
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px', marginBottom: '10px' }}>
              <div className="badge-filters" style={{ marginBottom: 0 }}>
                {[
                  { key: '7d',  label: '7D' },
                  { key: '30d', label: '30D' },
                  { key: 'all', label: 'All' },
                ].map(r => (
                  <button
                    key={r.key}
                    className={'badge-filter-tab' + (distanceRange === r.key ? ' active' : '')}
                    onClick={() => setDistanceRange(r.key)}
                  >
                    {r.label}
                  </button>
                ))}
              </div>
              <div className="badge-filters" style={{ marginBottom: 0 }}>
                {Object.keys(METRICS).map(k => (
                  <button
                    key={k}
                    className={'badge-filter-tab' + (metricKey === k ? ' active' : '')}
                    onClick={() => setMetricKey(k)}
                  >
                    {METRICS[k].label}
                  </button>
                ))}
              </div>
            </div>

            {rangedData.length === 0 ? (
              <p style={{ fontSize: '12px', color: BLUE_DIM, padding: '20px 0', textAlign: 'center' }}>No walks in this range yet.</p>
            ) : (
              <div className={'chart-wrap' + (overflow ? ' has-overflow' : '')}>
                <div className="chart-scroll" ref={scrollRef}>
                  <div style={{ minWidth: 'min-content', padding: '0 4px', width: overflow ? 'max-content' : '100%' }}>
                    <div style={{ display: 'flex', gap: '6px' }}>
                      {rangedData.map((day, idx) => (
                        <div key={idx} style={{ width: overflow ? '34px' : undefined, flex: overflow ? '0 0 auto' : '1 1 0', minWidth: 0, fontSize: '8px', fontWeight: 700, textAlign: 'center', height: '12px', marginBottom: '3px', color: day[metricKey] === rangeMaxValue ? GOLD_LIGHT : BLUE_LIGHT }}>
                          {activeMetric.fmt(day[metricKey])}
                        </div>
                      ))}
                    </div>
                    <div style={{ position: 'relative', height: '120px' }}>
                      <svg
                        width={overflow ? Math.max(0, rangedData.length * 40 - 6) : '100%'}
                        height="120"
                        viewBox={`0 0 ${Math.max(1, rangedData.length * 40 - 6)} 120`}
                        preserveAspectRatio={overflow ? undefined : 'none'}
                        style={{ position: 'absolute', left: 0, top: 0, pointerEvents: 'none', overflow: 'visible' }}
                      >
                        <polyline
                          points={rangeAvgLine.map((v, i) => `${i * 40 + 17},${120 - (v / rangeMaxValue) * 120}`).join(' ')}
                          fill="none" stroke={GOLD_LIGHT} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" opacity="0.85"
                        />
                        {rangeAvgLine.map((v, i) => (
                          <circle key={i} cx={i * 40 + 17} cy={120 - (v / rangeMaxValue) * 120} r="2" fill={GOLD_LIGHT} opacity="0.9" />
                        ))}
                      </svg>
                      <div style={{ display: 'flex', alignItems: 'flex-end', gap: '6px', height: '100%' }}>
                        {rangedData.map((day, idx) => (
                          <div key={idx} style={{ width: overflow ? '34px' : undefined, flex: overflow ? '0 0 auto' : '1 1 0', minWidth: 0, display: 'flex', justifyContent: 'center' }}>
                            <div
                              className={'bar' + (day[metricKey] === rangeMaxValue ? ' is-max' : '')}
                              style={{ width: overflow ? '18px' : '50%', maxWidth: overflow ? undefined : '44px', height: `${(day[metricKey] / rangeMaxValue) * 120}px`, minHeight: '6px' }}
                            />
                          </div>
                        ))}
                      </div>
                    </div>
                    <div style={{ display: 'flex', gap: '6px', marginTop: '5px' }}>
                      {rangedData.map((day, idx) => (
                        <div key={idx} style={{ width: overflow ? '34px' : undefined, flex: overflow ? '0 0 auto' : '1 1 0', minWidth: 0, fontSize: '8px', color: BLUE_DIM, fontWeight: 500, textAlign: 'center' }}>
                          {day.date.split(' ')[1]}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginTop: '10px', fontSize: '10px', color: BLUE_DIM, fontWeight: 500 }}>
              <span style={{ width: '14px', height: '2px', borderRadius: '2px', background: GOLD_LIGHT, opacity: 0.85 }} /> {activeMetric.axisLabel}
            </div>

            {overflow && (
              <div className="scroll-hint">
                <span className="l"><Icon name="chevron" c="rgba(160,210,255,0.65)" size={13} sw={2.4} /></span>
                Scroll to see all {rangedData.length} days
                <span className="r"><Icon name="chevron" c="rgba(160,210,255,0.65)" size={13} sw={2.4} /></span>
              </div>
            )}
          </div>

          {/* ── Badges ── */}
          <div style={{ marginBottom: 'clamp(14px, 3vw, 22px)' }}>

            {/* Latest badge spotlight — always visible */}
            {latestBadge && (
              <div className="latest-badge-spotlight" style={{ marginBottom: '14px' }}>
                {showConfetti && (
                  <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }}>
                    {Array.from({ length: 12 }).map((_, i) => (
                      <span
                        key={i}
                        className="confetti-piece"
                        style={{
                          left: `${(i * 37) % 100}%`,
                          background: i % 2 === 0 ? GOLD_LIGHT : BLUE_LIGHT,
                          animationDelay: `${(i % 5) * 0.08}s`,
                          transform: `rotate(${(i * 53) % 360}deg)`,
                        }}
                      />
                    ))}
                  </div>
                )}
                <div className="latest-badge-icon">
                  <BadgeArt icon={latestBadge.icon} value={latestBadge.mile} color={GOLD_LIGHT} size={28} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div className="badge-latest-pill">Latest earned</div>
                  <div style={{ fontSize: 'clamp(13px, 2.5vw, 15px)', fontWeight: 700, color: GOLD_LIGHT, lineHeight: 1.2 }}>{latestBadge.name}</div>
                  <div style={{ fontSize: '11px', color: 'rgba(251,218,106,0.70)', marginTop: '2px' }}>{latestBadge.description}</div>
                </div>
              </div>
            )}

            {/* Collapsible header */}
            <div
              className="section-toggle"
              onClick={() => setBadgesOpen(o => !o)}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: badgesOpen ? '14px' : '0', padding: '4px 2px' }}
            >
              <div style={{ display: 'flex', alignItems: 'center', gap: '9px' }}>
                <Icon name="crown" c={BLUE_MID} size={18} sw={2} />
                <h2 style={{ fontSize: 'clamp(12px, 2.5vw, 15px)', fontWeight: 600, color: BLUE_LIGHT, textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                  Badges Earned
                </h2>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span style={{
                  fontSize: '12px', fontWeight: 500, color: GOLD,
                  background: 'rgba(203,161,53,0.15)',
                  border: '1px solid rgba(203,161,53,0.32)',
                  borderRadius: '20px', padding: '3px 11px'
                }}>
                  {unlockedCount} / {data.badges.length}
                </span>
                <span className={'chevron-icon' + (badgesOpen ? ' open' : '')}>
                  <Icon name="chevron" c={BLUE_MID} size={18} sw={2.2} />
                </span>
              </div>
            </div>

            {/* Expanded: filter tabs + grid */}
            {badgesOpen && (
              <>
                <div className="badge-filters">
                  {[
                    { key: 'all',      label: `All (${data.badges.length})` },
                    { key: 'earned',   label: `Earned (${unlockedCount})` },
                    { key: 'unearned', label: `Unearned (${data.badges.length - unlockedCount})` },
                  ].map(f => (
                    <button
                      key={f.key}
                      className={'badge-filter-tab' + (badgeFilter === f.key ? ' active' : '')}
                      onClick={() => setBadgeFilter(f.key)}
                    >
                      {f.label}
                    </button>
                  ))}
                </div>
                <div className="badge-grid">
                  {filteredBadges.map(badge => {
                    const isLatest = badge.id === latestBadge?.id;
                    const col = badge.unlocked ? GOLD_LIGHT : BLUE_DIM;
                    return (
                      <div
                        key={badge.id}
                        className={badge.unlocked ? 'glass-gold badge-glow' : 'glass-dim'}
                        style={{
                          padding: 'clamp(10px, 2.5vw, 16px)',
                          borderRadius: '16px',
                          textAlign: 'center',
                          opacity: badge.unlocked ? 1 : 0.6,
                          position: 'relative',
                        }}
                      >
                        {isLatest && (
                          <div style={{ position: 'absolute', top: '-8px', left: '50%', transform: 'translateX(-50%)' }}>
                            <span className="badge-latest-pill" style={{ whiteSpace: 'nowrap' }}>Latest</span>
                          </div>
                        )}
                        <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '8px', marginTop: isLatest ? '4px' : 0 }}>
                          <BadgeArt icon={badge.icon} value={badge.mile} color={col} size={30} />
                        </div>
                        <div style={{ fontSize: 'clamp(10px, 1.8vw, 12px)', fontWeight: 700, color: col, marginBottom: '4px', lineHeight: 1.2 }}>
                          {badge.name}
                        </div>
                        <div style={{ fontSize: '10px', color: badge.unlocked ? 'rgba(251,218,106,0.75)' : BLUE_DIM, lineHeight: 1.35 }}>{badge.description}</div>
                        {badge.unlocked && (
                          <div style={{ marginTop: '7px', fontSize: '10px', color: GOLD, fontWeight: 600, letterSpacing: '0.3px' }}>✓ Unlocked</div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </>
            )}
          </div>

          {/* ── Recovery Insights ── */}
          <div className="glass-blue" style={{ padding: 'clamp(16px, 3vw, 24px)', borderRadius: '20px' }}>
            <SectionTitle icon="target">Recovery Insights</SectionTitle>

            {/* TL;DR — always visible */}
            <div className="tldr-card">
              <div className="tldr-pill">TL;DR</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '9px' }}>
                <Icon name="shield" c={GOLD_LIGHT} size={26} sw={2} />
                <div className="tldr-headline">Consistency, not distance</div>
              </div>
              <p style={{ fontSize: 'clamp(12px, 2vw, 14px)', color: BLUE_LIGHT, lineHeight: 1.7, fontWeight: 400 }}>
                You're <b style={{ color: GOLD_LIGHT }}>40% faster</b> than week one — short gaps, not fitness, are what keep resetting your streak.
              </p>
              <div className="tldr-action">
                <span className="ico"><Icon name="arrow" c={GOLD_LIGHT} size={15} sw={2} /></span>
                <span><b style={{ color: GOLD_LIGHT }}>Do this next:</b> Lock in a daily <b>1-mile floor</b>. The <b>25-Mile Club</b> is about 9 miles away.</span>
              </div>
            </div>

            {/* Collapsible full analysis — same pattern as Badges */}
            <div
              className="section-toggle"
              onClick={() => setInsightsOpen(o => !o)}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '16px', marginBottom: insightsOpen ? '6px' : '0', padding: '4px 2px' }}
            >
              <div style={{ display: 'flex', alignItems: 'center', gap: '9px' }}>
                <Icon name="layers" c={BLUE_MID} size={18} sw={2} />
                <h2 style={{ fontSize: 'clamp(12px, 2.5vw, 15px)', fontWeight: 600, color: BLUE_LIGHT, textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                  Full Analysis
                </h2>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                <span style={{
                  fontSize: '12px', fontWeight: 500, color: BLUE_MID,
                  background: 'rgba(116,172,223,0.15)',
                  border: '1px solid rgba(116,172,223,0.32)',
                  borderRadius: '20px', padding: '3px 11px'
                }}>
                  5 tips
                </span>
                <span className={'chevron-icon' + (insightsOpen ? ' open' : '')}>
                  <Icon name="chevron" c={BLUE_MID} size={18} sw={2.2} />
                </span>
              </div>
            </div>

            {insightsOpen && (
              <>
                <p style={{ fontSize: 'clamp(12px, 2vw, 14px)', color: BLUE_LIGHT, lineHeight: 1.75, fontWeight: 400, marginTop: '8px' }}>
                  Strong, steady recovery so far. You've logged <b style={{ color: GOLD_LIGHT }}>23 walks across 20 days</b> for <b style={{ color: GOLD_LIGHT }}>15.8 miles</b> since June 1, and the trend is clearly upward: your typical walk has grown from about <b style={{ color: GOLD_LIGHT }}>0.33 mi</b> early on to a standout <b style={{ color: GOLD_LIGHT }}>2.68 mi</b> effort on June 30, while your pace has improved from ~39 to ~23 min/mi this week — about <b style={{ color: GOLD_LIGHT }}>40% faster</b>. Your best stretch was a 5-day streak (Jun 7–11), and Jun 30 set a new mark: your longest single walk (2.68 mi) at 18:05/mi, your fastest pace yet.
                </p>
                <p style={{ fontSize: 'clamp(12px, 2vw, 14px)', color: BLUE_LIGHT, lineHeight: 1.75, fontWeight: 400, marginTop: '12px' }}>
                  The single biggest lever now is <b style={{ color: GOLD_LIGHT }}>consistency, not distance</b>. The gaps on Jun 6, 12, 14, 19–22, 26 and 28 are what keep resetting your streak — the four-day pause (Jun 19–22) alone broke what could have been a 3-week run. You've now stacked two-a-day walks three times (Jun 11, Jun 29, and Jun 30), a great sign, and carried a 3-day streak straight across into July (Jun 29–Jul 1) — your first stretch that's crossed a month boundary. Here's how to convert your rising fitness into bigger milestones:
                </p>
                <ul className="insight-list">
                  <li>
                    <span className="ico"><Icon name="shield" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Set a daily floor.</b> On low-energy days, do a 0.3–0.4 mi "minimum walk" instead of skipping. That one habit would have turned your 5-day streak into 20+ and is the fastest route to the 14-Day Streak badge.</span>
                  </li>
                  <li>
                    <span className="ico"><Icon name="arrow" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Lock in 1 mile.</b> Outside of June 30's breakout, your last three walks (Jun 27, 29, Jul 1) are averaging just over 1 mi — you're already there. Hold the line at a steady <b>1.0 mi/day</b> baseline, and treat June 30-style efforts as a bonus, not the norm.</span>
                  </li>
                  <li>
                    <span className="ico"><Icon name="layers" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Stack a second effort.</b> You've now done it three times (Jun 11, Jun 29, Jun 30) — and June 30's second walk was your best one yet. Two solid walks in a day is a proven way to rack up miles fast.</span>
                  </li>
                  <li>
                    <span className="ico"><Icon name="medal" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Next milestone: 25-Mile Club.</b> You're <b>9.2 miles away</b>. At a steady 1.0 mi/day that's about 9 days; at your current ~0.79 mi/day average it's closer to 12 days.</span>
                  </li>
                  <li>
                    <span className="ico"><Icon name="bolt" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Keep one brisk walk weekly.</b> Your pace hit 18:05/mi on June 30's afternoon walk, a big step up from your typical 25–35 min/mi — protect that gain with one brisk effort like this each week while keeping the rest easy and recovery-paced.</span>
                  </li>
                </ul>
              </>
            )}
          </div>

          {/* ── Last updated ── */}
          <div style={{ marginTop: 'clamp(20px, 4vw, 32px)', textAlign: 'center' }}>
            <span style={{ fontSize: '11px', color: 'rgba(116,172,223,0.55)', fontWeight: 400, letterSpacing: '0.3px' }}>
              Data updated · {data.updated}
            </span>
          </div>

          {/* ── Argentina flag footer ── */}
          <div style={{ marginTop: 'clamp(12px, 2vw, 18px)', textAlign: 'center' }}>
            <a
              href="https://www.youtube.com/watch?v=q_q3hg7KXWM"
              target="_blank"
              rel="noopener noreferrer"
              title="AFA Selección Argentina"
              className="flag-link"
              style={{ display: 'inline-flex', flexDirection: 'column', alignItems: 'center', gap: '6px', textDecoration: 'none', opacity: 0.85, transition: 'opacity 0.2s' }}
              onMouseEnter={e => e.currentTarget.style.opacity = '1'}
              onMouseLeave={e => e.currentTarget.style.opacity = '0.85'}
            >
              <svg className="flag-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="48" height="32" style={{ display: 'block', borderRadius: '4px', boxShadow: '0 2px 8px rgba(0,0,0,0.35)' }}>
                <rect width="900" height="600" fill="#74ACDF"/>
                <rect y="200" width="900" height="200" fill="#fff"/>
                <circle cx="450" cy="300" r="60" fill="#F6B40E"/>
                <g fill="#F6B40E" stroke="#CD8B00" strokeWidth="2">
                  {[0,30,60,90,120,150,180,210,240,270,300,330,360].map((deg, i) => {
                    const rad = (deg * Math.PI) / 180;
                    const x1 = 450 + 62 * Math.cos(rad);
                    const y1 = 300 + 62 * Math.sin(rad);
                    const x2 = 450 + 90 * Math.cos(rad);
                    const y2 = 300 + 90 * Math.sin(rad);
                    return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} strokeWidth="6" stroke="#F6B40E"/>;
                  })}
                </g>
                <circle cx="450" cy="300" r="42" fill="#F6B40E"/>
                <circle cx="450" cy="300" r="30" fill="#CD8B00"/>
                <circle cx="450" cy="300" r="22" fill="#F6B40E"/>
              </svg>
              <span className="flag-label" style={{ fontSize: '11px', fontWeight: 600, letterSpacing: '0.05em', color: 'rgba(255,255,255,0.6)', fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' }}>Campeones Del Mundo</span>
            </a>
          </div>

        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<WalkTracker />);
  </script>
</body>
</html>
