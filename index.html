<html>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(ellipse 110% 20% at 50% 44%, rgba(255,255,255,0.16)   0%, transparent 100%),
        radial-gradient(ellipse 80%  60% at 8%  30%, rgba(116,172,223,0.55)   0%, transparent 55%),
        radial-gradient(ellipse 55%  70% at 90% 10%, rgba(100,165,220,0.40)   0%, transparent 50%),
        radial-gradient(ellipse 70%  50% at 50% 90%, rgba(10, 40, 85, 0.90)   0%, transparent 65%),
        linear-gradient(155deg, #0f3d6b 0%, #1a6cb5 30%, #3b8fd4 65%, #74ACDF 100%);
      min-height: 100vh;
      padding: clamp(16px, 5vw, 44px) clamp(12px, 4vw, 32px);
    }

    #root { max-width: 1040px; margin: 0 auto; }

    /* ── Liquid Glass layers ── */
    .glass-shell {
      background: rgba(5, 30, 65, 0.72);
      backdrop-filter: blur(48px) saturate(190%) brightness(1.06);
      -webkit-backdrop-filter: blur(48px) saturate(190%) brightness(1.06);
      border: 1px solid rgba(116, 172, 223, 0.40);
      border-radius: 32px;
      box-shadow:
        0 16px 56px rgba(0, 0, 0, 0.38),
        0 3px 8px  rgba(0, 0, 0, 0.20),
        inset 0 2px 0   rgba(255, 255, 255, 0.18),
        inset 0 -1px 0  rgba(0, 0, 0, 0.10);
    }

    .glass-panel {
      background: rgba(10, 45, 100, 0.55);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(116, 172, 223, 0.35);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.18);
    }

    .glass-blue {
      background: rgba(10, 55, 120, 0.65);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      border: 1px solid rgba(116, 172, 223, 0.50);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(28, 63, 117, 0.30),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.18);
    }

    .glass-gold {
      background: rgba(80, 50, 5, 0.60);
      backdrop-filter: blur(24px) saturate(155%);
      -webkit-backdrop-filter: blur(24px) saturate(155%);
      border: 1px solid rgba(246, 180, 14, 0.55);
      border-radius: 20px;
      box-shadow:
        0 4px 20px rgba(246, 180, 14, 0.20),
        0 0 28px  rgba(246, 180, 14, 0.10),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.15);
    }

    .glass-dim {
      background: rgba(10, 35, 80, 0.45);
      border: 1px solid rgba(116, 172, 223, 0.20);
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    /* ── Chart bar ── */
    .bar {
      background: linear-gradient(to top,
        rgba(100, 165, 220, 0.60) 0%,
        rgba(200, 232, 255, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 5px 5px 3px 3px;
      box-shadow:
        0 2px 10px rgba(116, 172, 223, 0.50),
        inset 0 1px 0  rgba(255, 255, 255, 0.60);
      transition: filter 0.2s;
    }
    .bar.is-max {
      background: linear-gradient(to top,
        rgba(246, 180, 14, 0.70) 0%,
        rgba(251, 218, 106, 0.98) 100%);
      box-shadow:
        0 2px 12px rgba(246, 180, 14, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }
    .bar.is-hot {
      background: repeating-linear-gradient(45deg,
        rgba(251, 218, 106, 0.90) 0 5px,
        rgba(138, 106, 16, 0.90) 5px 10px);
      border: 1px solid rgba(246, 180, 14, 0.55);
      box-shadow:
        0 2px 12px rgba(246, 180, 14, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    /* ── Hero: momentum score + today's rings ── */
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(10px, 2vw, 16px);
    }
    @media (max-width: 640px) { .hero-grid { grid-template-columns: 1fr; } }

    /* ── Responsive grids ── */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2vw, 16px);
    }
    @media (max-width: 500px) {
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .stat-grid > *:last-child { grid-column: 1 / -1; }
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(8px, 2vw, 12px);
    }
    @media (max-width: 620px) { .badge-grid { grid-template-columns: repeat(2, 1fr); } }

    /* ── Scrollable chart ── */
    .chart-wrap { position: relative; }
    .chart-wrap.has-overflow::before,
    .chart-wrap.has-overflow::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 30px;
      pointer-events: none;
      z-index: 3;
    }
    .chart-wrap.has-overflow::before { left: 0;  background: linear-gradient(to right, rgba(8,38,86,0.92), transparent); }
    .chart-wrap.has-overflow::after  { right: 0; background: linear-gradient(to left,  rgba(8,38,86,0.92), transparent); }

    .chart-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .chart-scroll::-webkit-scrollbar { display: none; }

    .scroll-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: rgba(160, 210, 255, 0.65);
      margin-top: 12px;
    }
    .scroll-hint svg { animation: nudge 1.8s ease-in-out infinite; }
    .scroll-hint .r svg { transform: scaleX(-1); }
    @keyframes nudge {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50%      { opacity: 1;   transform: translateX(2px); }
    }

    /* ── Dancing flag ── */
    .flag-icon {
      animation: flag-sway 3.2s ease-in-out infinite;
      transform-origin: 50% 90%;
    }
    .flag-label {
      display: inline-block;
    }
    .flag-link:hover .flag-icon {
      animation: flag-dance 0.6s ease-in-out infinite;
    }
    .flag-link:hover .flag-label {
      animation: flag-bob 0.6s ease-in-out infinite;
      animation-delay: 0.08s;
    }
    @keyframes flag-sway {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(3deg); }
    }
    @keyframes flag-dance {
      0%   { transform: rotate(0deg)    translateY(0)    scale(1); }
      15%  { transform: rotate(-12deg)  translateY(-4px) scale(1.06); }
      30%  { transform: rotate(9deg)    translateY(0)    scale(0.95); }
      45%  { transform: rotate(-8deg)   translateY(-3px) scale(1.05); }
      60%  { transform: rotate(10deg)   translateY(1px)  scale(0.96); }
      75%  { transform: rotate(-6deg)   translateY(-2px) scale(1.03); }
      90%  { transform: rotate(4deg)    translateY(0)    scale(0.99); }
      100% { transform: rotate(0deg)    translateY(0)    scale(1); }
    }
    @keyframes flag-bob {
      0%, 100% { transform: translateY(0)    rotate(0deg); }
      25%      { transform: translateY(-2px) rotate(-3deg); }
      50%      { transform: translateY(0)    rotate(0deg); }
      75%      { transform: translateY(-2px) rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .flag-icon, .flag-label { animation: none !important; }
    }

    /* ── Calendar ── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: clamp(5px, 1.4vw, 8px);
    }
    .cal-dow {
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(160, 210, 255, 0.55);
      padding-bottom: 4px;
    }
    .cal-cell {
      aspect-ratio: 1 / 1;
      border-radius: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .cal-num  { font-size: clamp(10px, 2vw, 13px); font-weight: 600; line-height: 1; }
    .cal-cell-top {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      width: 100%;
      flex: 0 0 auto;
      padding: clamp(4px, 1vw, 7px) clamp(5px, 1.2vw, 8px) 0;
      box-sizing: border-box;
    }
    .cal-num-active {
      font-size: clamp(8.5px, 1.6vw, 11px);
      font-weight: 700;
      line-height: 1;
    }
    .cal-hero { display: flex; flex: 1 1 auto; min-height: 0; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
    .cal-hero-val { font-size: clamp(13px, 3.6vw, 25px); font-weight: 800; line-height: 1; }
    .cal-hero-unit { font-size: clamp(6px, 1.3vw, 9px); font-weight: 700; letter-spacing: 0.3px; text-transform: uppercase; margin-top: clamp(1px, 0.5vw, 3px); opacity: 0.7; }
    .cal-twice {
      position: absolute;
      top: clamp(4px, 1vw, 7px);
      right: clamp(5px, 1.2vw, 8px);
      font-size: clamp(8px, 1.6vw, 10px);
      color: #FBDA6A;
      line-height: 1;
    }
    .cal-today { outline: 2px solid rgba(251, 218, 106, 0.85); outline-offset: 1px; }
    .cal-clickable { cursor: pointer; transition: filter 0.15s, box-shadow 0.15s; }
    .cal-clickable:hover { filter: brightness(1.18); }
    .cal-selected { box-shadow: 0 0 0 2px rgba(232, 244, 255, 0.85), 0 4px 14px rgba(232, 244, 255, 0.25); }

    /* ── Month nav pills ── */
    .month-nav-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 20px;
      cursor: pointer;
      background: rgba(116, 172, 223, 0.16);
      border: 1px solid rgba(116, 172, 223, 0.38);
      color: rgba(210, 232, 255, 0.90);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .month-nav-btn:hover { background: rgba(116, 172, 223, 0.30); border-color: rgba(116, 172, 223, 0.55); }
    .month-nav-btn:active { transform: scale(0.96); }
    .month-nav-btn.disabled { opacity: 0.28; cursor: default; pointer-events: none; }

    /* ── Trend delta pill ── */
    .trend-delta {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 20px;
      padding: 2px 8px;
      letter-spacing: 0.2px;
    }
    .trend-delta.up {
      color: #FBDA6A;
      background: rgba(246, 180, 14, 0.18);
      border: 1px solid rgba(246, 180, 14, 0.45);
    }
    .trend-delta.down {
      color: rgba(190, 220, 255, 0.85);
      background: rgba(116, 172, 223, 0.14);
      border: 1px solid rgba(116, 172, 223, 0.30);
    }
    .trend-delta.flat {
      color: rgba(160, 210, 255, 0.70);
      background: rgba(116, 172, 223, 0.10);
      border: 1px solid rgba(116, 172, 223, 0.24);
    }

    /* ── Wordmark ── */
    .wordmark { display: flex; align-items: center; gap: clamp(12px, 3vw, 16px); }
    .wordmark-badge {
      width: clamp(52px, 12vw, 68px);
      height: clamp(52px, 12vw, 68px);
      flex: 0 0 auto;
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.40), 0 2px 6px rgba(0,0,0,0.25);
    }
    .wordmark-eyebrow {
      font-size: clamp(9px, 2vw, 11px);
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(251, 218, 106, 0.85);
      margin-bottom: 3px;
    }
    .wordmark-title {
      font-size: clamp(26px, 6.5vw, 40px);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 0.95;
      background: linear-gradient(115deg, #FFFFFF 0%, #E8F4FF 38%, #74ACDF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
    }

    /* ── BETA pill ── */
    .beta-pill {
      display: inline-block;
      margin-left: 10px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      background: rgba(116, 172, 223, 0.28);
      border: 1px solid rgba(116, 172, 223, 0.45);
      border-radius: 6px;
      padding: 2px 7px;
      color: rgba(190, 225, 255, 0.92);
      vertical-align: middle;
      position: relative;
      top: -3px;
    }

    /* ── Badge glow ── */
    .badge-glow {
      box-shadow:
        0 6px 24px rgba(246, 180, 14, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.35);
    }

    /* ── Collapsible section header ── */
    .section-toggle {
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      border-radius: 12px;
      transition: background 0.15s;
    }
    .section-toggle:hover { background: rgba(116, 172, 223, 0.06); }

    .chevron-icon {
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    .chevron-icon.open { transform: rotate(90deg); }

    /* ── Badge filter tabs ── */
    .badge-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .badge-filter-tab {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      padding: 5px 13px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid rgba(116, 172, 223, 0.28);
      background: rgba(10, 45, 100, 0.35);
      color: rgba(160, 210, 255, 0.70);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .badge-filter-tab:hover {
      background: rgba(10, 55, 120, 0.55);
      color: rgba(200, 232, 255, 0.90);
    }
    .badge-filter-tab.active {
      background: rgba(246, 180, 14, 0.18);
      border-color: rgba(246, 180, 14, 0.55);
      color: #FBDA6A;
    }

    /* ── Latest-badge spotlight ── */
    .latest-badge-spotlight {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(80, 50, 5, 0.45);
      border: 1px solid rgba(246, 180, 14, 0.40);
      box-shadow: 0 4px 16px rgba(246, 180, 14, 0.12), inset 0 1px 0 rgba(255,255,255,0.12);
      position: relative;
    }

    /* ── Badge-unlock confetti ── */
    .confetti-piece {
      position: absolute;
      top: -10px;
      width: 6px;
      height: 10px;
      border-radius: 2px;
      animation: confetti-fall 1.6s ease-in forwards;
      pointer-events: none;
    }
    @keyframes confetti-fall {
      0%   { transform: translateY(0) rotate(0deg);    opacity: 1; }
      100% { transform: translateY(90px) rotate(360deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .confetti-piece { display: none; }
    }
    .latest-badge-icon {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      border-radius: 14px;
      background: rgba(246, 180, 14, 0.14);
      border: 1px solid rgba(246, 180, 14, 0.40);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Badge "Latest" label ── */
    .badge-latest-pill {
      display: inline-block;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      background: rgb(43, 30, 6);
      border: 1px solid rgba(246, 180, 14, 0.70);
      border-radius: 5px;
      padding: 2px 6px;
      color: #FBDA6A;
      margin-bottom: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    /* ── Insights ── */
    .insight-list { list-style: none; margin-top: 14px; display: flex; flex-direction: column; gap: 11px; }
    .insight-list li {
      display: flex;
      gap: 11px;
      font-size: clamp(12px, 2vw, 14px);
      line-height: 1.6;
      color: rgba(220, 238, 255, 0.92);
    }
    .insight-list li .ico {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(246, 180, 14, 0.16);
      border: 1px solid rgba(246, 180, 14, 0.40);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
    .insight-list li b { color: #FBDA6A; font-weight: 700; }

    /* ── TL;DR card ── */
    .tldr-card {
      background: rgba(116, 172, 223, 0.10);
      border: 1px solid rgba(116, 172, 223, 0.30);
      border-radius: 16px;
      padding: clamp(14px, 3vw, 18px);
    }
    .tldr-pill {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(116, 172, 223, 0.22);
      border: 1px solid rgba(116, 172, 223, 0.45);
      border-radius: 6px;
      padding: 3px 9px;
      color: #BEE1FF;
      margin-bottom: 10px;
    }
    .tldr-headline {
      font-size: clamp(21px, 4.6vw, 29px);
      font-weight: 800;
      letter-spacing: -0.4px;
      line-height: 1.15;
      color: #FBDA6A;
    }
    .tldr-action {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(116, 172, 223, 0.20);
      font-size: clamp(12px, 2vw, 14px);
      line-height: 1.6;
      color: rgba(220, 238, 255, 0.92);
    }
    .tldr-action .ico {
      flex: 0 0 auto;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: rgba(246, 180, 14, 0.18);
      border: 1px solid rgba(246, 180, 14, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const GOLD       = '#F6B40E';
    const GOLD_LIGHT = '#FBDA6A';
    const BLUE_LIGHT = '#E8F4FF';
    const BLUE_MID   = '#74ACDF';
    const BLUE_DIM   = 'rgba(160, 210, 255, 0.80)';
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const DOW = ['S','M','T','W','T','F','S'];

    /* ── Date / trend helpers ── */
    const parseDataDate = (dateStr, year) => {
      const [mon, day] = dateStr.split(' ');
      return new Date(year, MONTHS.indexOf(mon), parseInt(day, 10));
    };

    const formatPace = (minPerMile) => {
      if (!isFinite(minPerMile) || minPerMile <= 0) return '—';
      const m = Math.floor(minPerMile);
      const s = Math.round((minPerMile - m) * 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    };

    const DAY_MS = 86400000;

    /* True 7-calendar-day average: rest days count as 0, so gaps aren't hidden */
    const calendarRollingAverage = (allDays, targetDays, key, windowDays = 7) => {
      const byTime = new Map(allDays.map(d => [d.dateObj.getTime(), d[key]]));
      return targetDays.map(d => {
        let sum = 0;
        for (let i = 0; i < windowDays; i++) sum += byTime.get(d.dateObj.getTime() - i * DAY_MS) || 0;
        return sum / windowDays;
      });
    };

    /* ── Activity Trends metric config ── */
    const METRICS = {
      distance: { label: 'Distance',  unit: 'mi', fmt: v => v.toFixed(2),          axisLabel: '7-day distance average' },
      elevGain: { label: 'Elevation', unit: 'ft', fmt: v => Math.round(v).toString(), axisLabel: '7-day elevation average' },
      effort:   { label: 'Effort',    unit: '',   fmt: v => Math.round(v).toString(), axisLabel: '7-day effort average' },
    };

    const getWeekStart = (date) => {
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() - d.getDay());
      return d;
    };

    const bucketByWeek = (days, anchorDate) => {
      const buckets = new Map();
      days.forEach(d => {
        const wk = getWeekStart(d.dateObj).getTime();
        if (!buckets.has(wk)) buckets.set(wk, []);
        buckets.get(wk).push(d);
      });
      return [...buckets.entries()]
        .sort((a, b) => a[0] - b[0])
        .map(([wk, wDays]) => {
          const totalDistance = wDays.reduce((a, d) => a + d.distance, 0);
          const totalDuration = wDays.reduce((a, d) => a + (d.duration || 0), 0);
          /* Divide by calendar days elapsed in the week (rest days included), not just active days */
          const daysElapsed = Math.max(1, Math.min(7, Math.round((anchorDate - wk) / DAY_MS) + 1));
          return {
            weekStart: new Date(wk),
            days: wDays,
            avgDistance: totalDistance / daysElapsed,
            avgPace: totalDuration > 0 ? (totalDuration / 60) / totalDistance : null,
            totalDistance,
          };
        });
    };

    /* ── Detailed month grid, with prev/next navigation to browse history ── */

                  Strong, steady recovery: <b style={{ color: GOLD_LIGHT }}>25 walks across 21 days</b> for <b style={{ color: GOLD_LIGHT }}>18.2 miles</b> since June 1. Your typical walk has grown from <b style={{ color: GOLD_LIGHT }}>0.33 mi</b> to a <b style={{ color: GOLD_LIGHT }}>2.68 mi</b> peak on June 30, and pace has improved from ~40 to ~24 min/mi this week — about <b style={{ color: GOLD_LIGHT }}>40% faster</b>. Best stretch: a 5-day streak (Jun 7–11). Current records: longest walk 2.68 mi (Jun 30), fastest pace 17:50/mi (Jul 1).
                </p>
                <p style={{ fontSize: 'clamp(12px, 2vw, 14px)', color: BLUE_LIGHT, lineHeight: 1.75, fontWeight: 400, marginTop: '12px' }}>
                  <b style={{ color: GOLD_LIGHT }}>Consistency, not distance</b> is the biggest lever now. Gaps on Jun 6, 12, 14, 19–22, 26 and 28 keep resetting your streak — the four-day pause (Jun 19–22) alone cost a possible 3-week run. You've stacked two-a-day walks four times (Jun 11, 29, 30, Jul 1), and your current streak is <b style={{ color: GOLD_LIGHT }}>6 days</b> (Jun 27–Jul 2, bridging one rest day — streaks here allow one rest day per week, because rest is part of recovery), the first to cross a month boundary. Here's how to build on it:
                </p>
                <ul className="insight-list">
                  <li>
                    <span className="ico"><Icon name="shield" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Set a daily floor.</b> On low-energy days, walk 0.3–0.4 mi instead of skipping — that alone would've turned your 5-day streak into 20+, and it's the fastest path to the 14-Day Streak badge.</span>
                  </li>
                  <li>
                    <span className="ico"><Icon name="arrow" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Lock in 1 mile.</b> Excluding June 30's outlier, your last three walks (Jun 29, Jul 1, Jul 2) average <b>1.6 mi</b> — already past the floor. Treat big days as bonuses, not the baseline.</span>
                  </li>
                  <li>
                    <span className="ico"><Icon name="layers" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Stack a second effort.</b> You've done it four times (Jun 11, 29, 30, Jul 1), including July 1's pace record. Two walks a day is the fastest way to add miles.</span>
                  </li>
                  <li>
                    <span className="ico"><Icon name="medal" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Next milestone: 25-Mile Club.</b> <b>6.8 miles away</b> — about 7 days at 1.0 mi/day, or 8 at your current ~0.87 mi/day pace.</span>
                  </li>
                  <li>
                    <span className="ico"><Icon name="bolt" c={GOLD_LIGHT} size={14} sw={2} /></span>
                    <span><b>Keep one brisk walk weekly.</b> July 1's 17:50/mi record is well ahead of your typical 25–35 min/mi — protect it with one fast effort a week, easy the rest.</span>
                  </li>
                </ul>
              </>
            )}
          </div>

          {/* ── Last updated ── */}
          <div style={{ marginTop: 'clamp(20px, 4vw, 32px)', textAlign: 'center' }}>
            <span style={{ fontSize: '11px', color: 'rgba(116,172,223,0.55)', fontWeight: 400, letterSpacing: '0.3px' }}>
              Data updated · {data.updated}

          </div>

          {/* ── Argentina flag footer ── */}
          <div style={{ marginTop: 'clamp(12px, 2vw, 18px)', textAlign: 'center' }}>
            <a
              href="https://www.youtube.com/watch?v=q_q3hg7KXWM"
              target="_blank"
              rel="noopener noreferrer"
              title="AFA Selección Argentina"
              className="flag-link"
              style={{ display: 'inline-flex', flexDirection: 'column', alignItems: 'center', gap: '6px', textDecoration: 'none', opacity: 0.85, transition: 'opacity 0.2s' }}
              onMouseEnter={e => e.currentTarget.style.opacity = '1'}
              onMouseLeave={e => e.currentTarget.style.opacity = '0.85'}
            >
              <svg className="flag-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="48" height="32" style={{ display: 'block', borderRadius: '4px', boxShadow: '0 2px 8px rgba(0,0,0,0.35)' }}>
                <rect width="900" height="600" fill="#74ACDF"/>
                <rect y="200" width="900" height="200" fill="#fff"/>
                <circle cx="450" cy="300" r="60" fill="#F6B40E"/>
                <g fill="#F6B40E" stroke="#CD8B00" strokeWidth="2">
                  {[0,30,60,90,120,150,180,210,240,270,300,330,360].map((deg, i) => {
                    const rad = (deg * Math.PI) / 180;
                    const x1 = 450 + 62 * Math.cos(rad);
                    const y1 = 300 + 62 * Math.sin(rad);
                    const x2 = 450 + 90 * Math.cos(rad);
                    const y2 = 300 + 90 * Math.sin(rad);
                    return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} strokeWidth="6" stroke="#F6B40E"/>;
                  })}
                </g>
                <circle cx="450" cy="300" r="42" fill="#F6B40E"/>
                <circle cx="450" cy="300" r="30" fill="#CD8B00"/>
                <circle cx="450" cy="300" r="22" fill="#F6B40E"/>

              <span className="flag-label" style={{ fontSize: '11px', fontWeight: 600, letterSpacing: '0.05em', color: 'rgba(255,255,255,0.6)', fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' }}>Campeones Del Mundo</span>
            </a>
          </div>

        </div>
      );
    };

    /* Guards against a bad hand-edit of the data object rendering a blank page */
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError() { return { hasError: true }; }
      render() {
        if (this.state.hasError) {
          return (
            <div className="glass-shell" style={{ padding: '40px 24px', textAlign: 'center' }}>
              <div style={{ fontSize: '15px', fontWeight: 600, color: BLUE_LIGHT, marginBottom: '8px' }}>
                Something went wrong loading the tracker.
              </div>
              <div style={{ fontSize: '13px', color: BLUE_DIM }}>
                The data may be mid-update — try refreshing in a minute.
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary><WalkTracker /></ErrorBoundary>
    );
  </script>
</body>
