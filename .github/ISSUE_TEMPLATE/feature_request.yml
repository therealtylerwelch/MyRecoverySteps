name: Feature idea
description: A new stat, badge, or UI idea for the tracker
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would this help?
      description: What would this tell you about your recovery that you can't see today?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: What part of the site would this touch?
      options:
        - New badge
        - Momentum score / goal rings
        - Stats cards
        - Activity calendar
        - Activity trends (charts)
        - Recovery Insights prose
        - Something else
    validations:
      required: false
